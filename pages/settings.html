<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Settings — Double Eight AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.lang-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:4px;gap:4px;}
.lang-btn{flex:1;padding:.55rem 1rem;border-radius:7px;font-size:.9rem;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text3);transition:.2s;font-family:'Outfit',sans-serif;}
.lang-btn.active{background:var(--gold-dim);color:var(--gold);border:1px solid var(--border-gold);}
.saved-card{display:flex;align-items:center;gap:1rem;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.75rem;}
.card-logo{width:44px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;flex-shrink:0;}
.card-logo.visa{background:#1a1f71;color:#fff;}
.card-logo.mc{background:#eb001b;color:#fff;}
.card-logo.other{background:var(--surface);color:var(--text3);border:1px solid var(--border);}
.badge-default{background:var(--gold-dim);border:1px solid var(--border-gold);color:var(--gold);font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;}
</style>
<!-- Google tag (gtag.js) - Google Ads -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18199000373"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-18199000373');
</script>
<!-- Google tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BTB516M1RD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-BTB516M1RD');
</script>
</head>
<body>
<div class="app-grid-bg"></div><div class="page-particles"></div>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="hamburger">☰</button>
      <span class="topbar-title" id="page-title">SETTINGS</span>
    </div>
    <div class="page-content" style="max-width:680px">

      <div class="card" style="margin-bottom:1.25rem">
        <h3 id="profile-hdr" style="font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:1px;margin-bottom:1.25rem;color:var(--gold)">◑ PROFILE</h3>
        <div class="form-group"><label class="form-label" id="lbl-name">Full Name</label><input type="text" class="form-input" id="s-name" placeholder="Your full name"></div>
        <button class="btn btn-primary" id="save-profile-btn" onclick="saveProfile()">Save Profile</button>
      </div>


      <div class="card" style="margin-bottom:1.25rem">
        <h3 id="pay-hdr" style="font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:1px;margin-bottom:1rem;color:var(--gold)">◑ PAYMENT METHODS</h3>
        <div id="saved-cards-list"></div>
        <button class="btn btn-secondary" id="add-card-btn" style="width:100%;margin-top:.5rem" onclick="openModal('add-card-modal')">+ Add Payment Method</button>
      </div>

      <div class="card" style="margin-bottom:1.25rem">
        <h3 id="pw-hdr" style="font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:1px;margin-bottom:1.25rem;color:var(--gold)">◑ CHANGE PASSWORD</h3>
        <div class="form-group"><label class="form-label" id="lbl-email">Email Address</label><input type="email" class="form-input" id="s-email" disabled style="opacity:.5"></div>
        <div class="form-group"><label class="form-label" id="lbl-oldpw">Current Password</label><input type="password" class="form-input" id="s-oldpw" placeholder="••••••••"></div>
        <div class="form-group"><label class="form-label" id="lbl-newpw">New Password</label><input type="password" class="form-input" id="s-newpw" placeholder="Min 6 characters"></div>
        <div class="form-group"><label class="form-label" id="lbl-newpw2">Confirm Password</label><input type="password" class="form-input" id="s-newpw2" placeholder="Repeat new password"></div>
        <button class="btn btn-primary" id="update-pw-btn" onclick="changePassword()">Update Password</button>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:1rem;background:var(--surface2);border-radius:var(--radius)">
          <div><div id="signout-lbl" style="font-size:.9rem;font-weight:500">Sign Out</div><div id="signout-desc" style="font-size:.78rem;color:var(--text3)">Sign out of your Double Eight AI account</div></div>
          <button class="btn btn-secondary" id="signout-btn" onclick="Auth.logout()">Sign Out →</button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ADD CARD MODAL -->
<div class="modal-overlay" id="add-card-modal">
  <div class="modal" style="max-width:460px">
    <div class="modal-header">
      <div class="modal-title" id="add-card-title">ADD PAYMENT METHOD</div>
      <button class="modal-close" onclick="closeModal('add-card-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label" id="lbl-cname">Cardholder Name</label><input type="text" class="form-input" id="c-name" placeholder="Name on card"></div>
      <div class="form-group"><label class="form-label" id="lbl-cnum">Card Number</label><input type="text" class="form-input" id="c-num" placeholder="1234 5678 9012 3456" maxlength="19" oninput="formatCard(this)"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group"><label class="form-label" id="lbl-exp">Expiry</label><input type="text" class="form-input" id="c-exp" placeholder="MM/YY" maxlength="5" oninput="formatExp(this)"></div>
        <div class="form-group"><label class="form-label">CVV</label><input type="password" class="form-input" id="c-cvv" placeholder="•••" maxlength="4"></div>
      </div>
      <div style="background:rgba(245,158,11,.07);border:1px solid var(--border-gold);border-radius:9px;padding:.75rem 1rem;font-size:.78rem;color:var(--text3);display:flex;gap:.5rem">
        <span style="color:var(--gold);flex-shrink:0">🔒</span> <span id="card-note">Card details are encrypted. We only save the last 4 digits for display.</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancel-btn" onclick="closeModal('add-card-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-card-btn" onclick="saveCard()">Save Card</button>
    </div>
  </div>
</div>

<script src="../js/core.js"></script>
<script>
Auth.check(); buildLayout('settings');

function applyTranslations() {
  const isAr = localStorage.getItem('d8_lang')==='ar';
  document.getElementById('page-title').textContent = t('set.title');
  document.getElementById('profile-hdr').textContent = t('set.profile');
  document.getElementById('lbl-name').textContent = t('set.full_name');
  document.getElementById('save-profile-btn').textContent = t('set.save_profile');

  document.getElementById('pay-hdr').textContent = t('set.payment');
  document.getElementById('add-card-btn').textContent = t('set.add_card');
  document.getElementById('pw-hdr').textContent = t('set.password');
  document.getElementById('lbl-email').textContent = t('set.email');
  document.getElementById('lbl-oldpw').textContent = t('set.old_pw');
  document.getElementById('lbl-newpw').textContent = t('set.new_pw');
  document.getElementById('lbl-newpw2').textContent = t('set.confirm_pw');
  document.getElementById('update-pw-btn').textContent = t('set.update_pw');
  document.getElementById('signout-lbl').textContent = t('set.sign_out');
  document.getElementById('signout-desc').textContent = t('set.sign_out_desc');
  document.getElementById('signout-btn').textContent = t('set.sign_out') + ' →';
  document.getElementById('add-card-title').textContent = t('set.add_card_title');
  document.getElementById('lbl-cname').textContent = t('set.card_name');
  document.getElementById('lbl-cnum').textContent = t('set.card_num');
  document.getElementById('lbl-exp').textContent = t('bill.pay_expiry');
  document.getElementById('card-note').textContent = t('set.card_note');
  document.getElementById('cancel-btn').textContent = t('btn.cancel');
  document.getElementById('save-card-btn').textContent = t('set.save_card');
  document.title = isAr ? 'الإعدادات — Double Eight AI' : 'Settings — Double Eight AI';
}



async function loadProfile() {
  const d=await api.get('/user/profile');
  if(!d?.user) return;
  document.getElementById('s-name').value=d.user.name||'';
  document.getElementById('s-email').value=d.user.email||'';
  const lang=d.user.settings?.language||localStorage.getItem('d8_lang')||'en';
  localStorage.setItem('d8_lang',lang);
  applyDir(lang);
  applyTranslations();
  loadCards();
}
async function saveProfile() {
  const name=document.getElementById('s-name').value.trim();
  if(!name){Toast.show(t('set.name_required'),'error');return;}
  const d=await api.put('/user/profile',{name});
  if(d?.error){Toast.show(d.error,'error');return;}
  Auth.setUser({...Auth.user(),name});
  Toast.show(t('set.profile_updated'),'success');
}
async function changePassword() {
  const oldPw=document.getElementById('s-oldpw').value;
  const newPw=document.getElementById('s-newpw').value;
  const newPw2=document.getElementById('s-newpw2').value;
  const isAr=localStorage.getItem('d8_lang')==='ar';
  if(!oldPw||!newPw){Toast.show(t('set.fill_fields'),'error');return;}
  if(newPw!==newPw2){Toast.show(t('set.pw_mismatch'),'error');return;}
  if(newPw.length<6){Toast.show(t('set.pw_min_len'),'error');return;}
  const d=await api.put('/user/password',{currentPassword:oldPw,newPassword:newPw});
  if(d?.error){Toast.show(d.error,'error');return;}
  ['s-oldpw','s-newpw','s-newpw2'].forEach(id=>document.getElementById(id).value='');
  Toast.show(t('set.pw_changed'),'success');
}

function getSavedCards(){try{return JSON.parse(localStorage.getItem('d8_cards')||'[]');}catch{return[];}}
function persistCards(cards){
  localStorage.setItem('d8_cards',JSON.stringify(cards));
  api.put('/user/profile',{settings:{savedCards:cards.map(c=>({last4:c.last4,brand:c.brand,expiry:c.expiry,name:c.name}))}}).catch(()=>{});
}
function loadCards(){
  const cards=getSavedCards();
  const list=document.getElementById('saved-cards-list');
  const isAr=localStorage.getItem('d8_lang')==='ar';
  if(!cards.length){list.innerHTML=`<div style="font-size:.82rem;color:var(--text3);padding:.25rem 0 .5rem">${t('set.no_cards')}</div>`;return;}
  list.innerHTML=cards.map((c,i)=>`
    <div class="saved-card">
      <div class="card-logo ${c.brand}">${c.brand==='visa'?'VISA':c.brand==='mc'?'MC':'CARD'}</div>
      <div style="flex:1"><div style="font-size:.88rem;font-weight:500">•••• ${c.last4}</div><div style="font-size:.73rem;color:var(--text3)">${c.name} · Exp ${c.expiry}</div></div>
      ${i===0?`<span class="badge-default">${t('set.default')}</span>`:`<button class="btn btn-secondary btn-sm" onclick="setDefault(${i})">${t('set.set_default')}</button>`}
      <button class="btn btn-danger btn-sm" onclick="removeCard(${i})">✕</button>
    </div>`).join('');
}
function saveCard(){
  const num=document.getElementById('c-num').value.replace(/\s/g,'');
  const name=document.getElementById('c-name').value.trim();
  const exp=document.getElementById('c-exp').value.trim();
  const cvv=document.getElementById('c-cvv').value.trim();
  const isAr=localStorage.getItem('d8_lang')==='ar';
  if(!num||!name||!exp||!cvv){Toast.show(isAr?'أكمل جميع حقول البطاقة':'Fill all card fields','error');return;}
  if(num.length<15){Toast.show(isAr?'رقم بطاقة غير صالح':'Invalid card number','error');return;}
  const cards=getSavedCards();
  cards.push({last4:num.slice(-4),brand:num.startsWith('4')?'visa':num.startsWith('5')?'mc':'other',expiry:exp,name});
  persistCards(cards);
  closeModal('add-card-modal');
  ['c-num','c-name','c-exp','c-cvv'].forEach(id=>document.getElementById(id).value='');
  loadCards();
  Toast.show(isAr?'تم حفظ البطاقة!':'Card saved!','success');
}
function removeCard(i){const cards=getSavedCards();cards.splice(i,1);persistCards(cards);loadCards();Toast.show(localStorage.getItem('d8_lang')==='ar'?'تم الحذف':'Removed','info');}
function setDefault(i){const cards=getSavedCards();const[c]=cards.splice(i,1);cards.unshift(c);persistCards(cards);loadCards();Toast.show(localStorage.getItem('d8_lang')==='ar'?'تم تحديث الافتراضي':'Default updated','success');}
function formatCard(el){let v=el.value.replace(/\D/g,'').slice(0,16);el.value=v.replace(/(.{4})/g,'$1 ').trim();}
function formatExp(el){let v=el.value.replace(/\D/g,'');if(v.length>=2)v=v.slice(0,2)+'/'+v.slice(2,4);el.value=v;}

applyTranslations();
loadProfile();
</script>
</body>
</html>
