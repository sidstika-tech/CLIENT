<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Project Vault — Double Eight AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
</head>
<body>
<div class="app-grid-bg"></div><div class="page-particles"></div>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="hamburger">☰</button>
      <span class="topbar-title" id="page-title">PROJECT VAULT</span>
      <div class="topbar-right"><span id="vault-count" style="font-size:.8rem;color:var(--text3)">Loading...</span></div>
    </div>
    <div class="page-content">
      <div class="vault-filters" id="vault-filters">
        <button class="vault-filter active" onclick="filterVault('all',this)" id="f-all">All Reports</button>
        <button class="vault-filter" onclick="filterVault('tools',this)" id="f-tools">AI Tools</button>
        <button class="vault-filter" onclick="filterVault('generator',this)" id="f-gen">Business Plans</button>
        <button class="vault-filter" onclick="filterVault('market',this)" id="f-market">Market Research</button>
        <button class="vault-filter" onclick="filterVault('marketing',this)" id="f-mkt">Marketing</button>
      </div>
      <div id="vault-content" class="vault-grid">
        <div class="empty-state"><div class="empty-icon">▣</div><p id="loading-txt">Loading your reports...</p></div>
      </div>
    </div>
  </div>
</div>
<script src="../js/core.js"></script>
<script>
Auth.check(); buildLayout('vault');
const ICONS={business_plan:'📋',market_research:'◉',marketing_strategy:'◈',brand_kit:'🎨',business_name:'💡',slogan:'✍',competitor_matrix:'⚔',pricing_calculator:'💰',launch_roadmap:'🚀',contract:'📄',budget_estimator:'💵',pitch_deck:'🎯',ad_copy:'📢',seo_keywords:'🔍',content_calendar:'📅',market_study:'📊',cold_email:'📧',website_copy:'🌐',sales_script:'🎤',prompt_writer:'✦'};
let allReports=[];

function applyTranslations() {
  document.getElementById('page-title').textContent = t('vault.title');
  document.getElementById('f-all').textContent = t('vault.all');
  document.getElementById('f-tools').textContent = t('vault.tools');
  document.getElementById('f-gen').textContent = t('vault.generator');
  document.getElementById('f-market').textContent = t('vault.market');
  document.getElementById('f-mkt').textContent = t('vault.marketing');
  document.getElementById('loading-txt').textContent = t('vault.loading');
}
applyTranslations();

async function loadVault() {
  // Single source of truth for tool reports (now properly excludes package items)
  // plus the launch package endpoint for the 8 package documents
  const [tools, pkg] = await Promise.all([
    api.get('/tools/reports'),
    api.get('/launch-package').catch(() => null),
  ]);

  // Tool reports (everything except package items)
  const toolReports = (tools?.reports || []).map(r => ({ ...r, source: 'tools' }));

  // Launch Package reports — pull from package items that have a reportId
  const packageReports = [];
  if (pkg?.items) {
    for (const item of pkg.items) {
      if (item.reportId) {
        packageReports.push({
          _id: item.reportId,
          title: item.label + ' — ' + (pkg.dna?.matchResult?.businessMatch || ''),
          type: item.id,
          createdAt: pkg.dna?.completedAt || new Date(),
          source: 'package',
        });
      }
    }
  }

  // Dedup safety net: never show the same _id twice
  const seen = new Set();
  allReports = [...toolReports, ...packageReports]
    .filter(r => {
      if (seen.has(String(r._id))) return false;
      seen.add(String(r._id));
      return true;
    })
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  const isAr = localStorage.getItem('d8_lang') === 'ar';
  document.getElementById('vault-count').textContent = `${allReports.length} ${isAr ? 'تقارير' : 'reports'}`;
  renderVault(allReports);
}
function filterVault(type,btn) {
  document.querySelectorAll('.vault-filter').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderVault(type==='all'?allReports:allReports.filter(r=>r.source===type));
}
function renderVault(reports) {
  const isAr=localStorage.getItem('d8_lang')==='ar';
  if(!reports.length){document.getElementById('vault-content').innerHTML=`<div class="empty-state"><div class="empty-icon">▣</div><p>${t('vault.no_reports')}</p></div>`;return;}
  document.getElementById('vault-content').innerHTML=reports.map(r=>`
    <div class="vault-item">
      <div class="vault-item-header">
        <div class="vault-item-icon">${ICONS[r.type]||'📄'}</div>
        <div>
          <div class="vault-item-title">${r.title}</div>
          <div class="vault-item-meta">${r.type?.replace(/_/g,' ')} · ${timeAgo(r.createdAt)}</div>
        </div>
      </div>
      <div class="vault-item-actions">
        <button class="btn btn-secondary btn-sm" onclick="exportReport('${r._id}','pdf')">↓ PDF</button>
        <button class="btn btn-secondary btn-sm" onclick="exportReport('${r._id}','docx')">↓ DOCX</button>
        <button class="btn btn-danger btn-sm" onclick="deleteReport('${r._id}','${r.source}')">✕</button>
      </div>
    </div>`).join('');
}
async function deleteReport(id,source) {
  const isAr=localStorage.getItem('d8_lang')==='ar';
  if(!confirm(isAr?'حذف هذا التقرير؟':'Delete this report?')) return;
  const path=source==='generator'?`/generator/reports/${id}`:`/tools/reports/${id}`;
  const d=await api.del(path);
  if(d?.success){Toast.show(isAr?'تم الحذف':'Deleted','success');loadVault();}
  else Toast.show('Delete failed','error');
}
loadVault();
</script>
</body>
</html>
