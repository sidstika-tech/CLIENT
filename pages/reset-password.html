<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Double Eight AI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#f59e0b;--gold-dark:#d97706;--bg:#07070f;--bg2:#0d0d1c;--text:#fff;--text2:rgba(255,255,255,.6);--text3:rgba(255,255,255,.3);}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
.container{max-width:500px;width:100%;background:var(--bg2);border:1px solid rgba(245,158,11,.2);border-radius:20px;padding:3rem;}
.logo{font-family:'Bebas Neue',cursive;font-size:2rem;letter-spacing:2px;color:var(--gold);margin-bottom:2rem;text-align:center;}
h1{font-family:'Bebas Neue',cursive;font-size:2rem;letter-spacing:1px;margin-bottom:.5rem;text-align:center;}
.subtitle{font-size:.9rem;color:var(--text2);text-align:center;margin-bottom:2rem;}
.form-group{margin-bottom:1.5rem;}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.5rem;color:var(--text2);}
input{width:100%;padding:.95rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:var(--text);font-size:.9rem;font-family:'Outfit',sans-serif;transition:.2s;}
input:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.08);}
.btn{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#07070f;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700;padding:.95rem;border-radius:10px;border:none;cursor:pointer;margin-top:1rem;transition:.2s;}
.btn:hover{transform:translateY(-2px);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.message{padding:1rem;border-radius:10px;margin-top:1rem;font-size:.85rem;text-align:center;}
.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171;}
.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#4ade80;}
.back-link{text-align:center;margin-top:1.5rem;font-size:.85rem;}
.back-link a{color:var(--gold);text-decoration:none;}
.back-link a:hover{text-decoration:underline;}
.password-strength{margin-top:.5rem;font-size:.75rem;color:var(--text3);}
.strength-weak{color:#ef4444;}
.strength-medium{color:#f59e0b;}
.strength-strong{color:#22c55e;}
</style>
<!-- Google tag (gtag.js) - Google Ads -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18199000373"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

<!-- Google tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BTB516M1RD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-BTB516M1RD');
</script>
</head>
<body>
<div class="container">
  <div class="logo">🔐 DOUBLE EIGHT AI</div>
  
  <div id="resetForm">
    <h1>Reset Your Password</h1>
    <p class="subtitle">Enter your new password below</p>
    
    <form id="passwordResetForm">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required>
        <div class="password-strength" id="strength"></div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
      </div>

      <button type="submit" class="btn" id="submitBtn">Reset Password</button>
    </form>

    <div id="message"></div>

    <div class="back-link">
      <a href="../index.html">← Back to Login</a>
    </div>
  </div>

  <div id="successView" style="display:none;text-align:center;">
    <div style="font-size:4rem;margin-bottom:1rem;">✅</div>
    <h1>Password Reset Successful!</h1>
    <p class="subtitle">You can now log in with your new password.</p>
    <a href="../index.html" class="btn">Go to Login</a>
  </div>
</div>

<script>
const API_URL = 'https://api.doubleeight.online/api';

const passwordInput = document.getElementById('password');
const confirmPasswordInput = document.getElementById('confirmPassword');
const strengthDiv = document.getElementById('strength');
const form = document.getElementById('passwordResetForm');
const submitBtn = document.getElementById('submitBtn');
const messageDiv = document.getElementById('message');

// Password strength checker
passwordInput.addEventListener('input', () => {
  const password = passwordInput.value;
  let strength = 'Weak';
  let className = 'strength-weak';

  if (password.length >= 8) {
    if (/[A-Z]/.test(password) && /[0-9]/.test(password)) {
      strength = 'Strong';
      className = 'strength-strong';
    } else {
      strength = 'Medium';
      className = 'strength-medium';
    }
  }

  strengthDiv.textContent = password ? `Strength: ${strength}` : '';
  strengthDiv.className = `password-strength ${className}`;
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const password = passwordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  // Validation
  if (password.length < 6) {
    showMessage('Password must be at least 6 characters', 'error');
    return;
  }

  if (password !== confirmPassword) {
    showMessage('Passwords do not match', 'error');
    return;
  }

  // Get token from URL
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  if (!token) {
    showMessage('Invalid reset link', 'error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Resetting...';

  try {
    const response = await fetch(`${API_URL}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword: password })
    });

    const data = await response.json();

    if (data.success) {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    } else {
      showMessage(data.error || 'Reset failed', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset Password';
    }
  } catch (error) {
    console.error('Reset error:', error);
    showMessage('Network error. Please try again.', 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Reset Password';
  }
});

function showMessage(text, type) {
  messageDiv.textContent = text;
  messageDiv.className = `message ${type}`;
  setTimeout(() => messageDiv.textContent = '', 5000);
}
</script>
</body>
</html>
