<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Business Generator — Double Eight AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
</head>
<body>
<div class="app-grid-bg"></div><div class="page-particles"></div>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="hamburger">☰</button>
      <span class="topbar-title" id="page-title">BUSINESS GENERATOR</span>
    </div>
    <!-- Mobile tabs -->
    <div class="mobile-tool-tabs">
      <button class="mob-tool-tab active" id="mtab-form" onclick="showMobToolTab('form')">📝 Form</button>
      <button class="mob-tool-tab" id="mtab-result" onclick="showMobToolTab('result')">⚡ Result</button>
      <button class="mob-tool-tab" id="mtab-history" onclick="showMobToolTab('history')">🕐 History</button>
    </div>
    <div class="page-content">
      <div class="tool-page-grid">
        <div id="panel-form" class="card">
          <h3 style="font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:1px;margin-bottom:1.25rem;color:var(--gold)" id="form-title">⚡ GENERATE BUSINESS PLAN</h3>
          <div class="form-group"><label class="form-label" id="lbl-name">Business Name *</label><input type="text" class="form-input" id="g-name" placeholder="e.g. Nexus Capital AI"></div>
          <div class="form-group"><label class="form-label" id="lbl-industry">Industry *</label><input type="text" class="form-input" id="g-industry" placeholder="e.g. FinTech, Health, SaaS"></div>
          <div class="form-group"><label class="form-label" id="lbl-model">Business Model *</label><input type="text" class="form-input" id="g-model" placeholder="e.g. SaaS subscription, E-commerce"></div>
          <div class="form-group"><label class="form-label" id="lbl-market">Target Market *</label><input type="text" class="form-input" id="g-market" placeholder="e.g. SMBs in MENA, US freelancers"></div>
          <div class="form-group"><label class="form-label" id="lbl-invest">Initial Investment</label><input type="text" class="form-input" id="g-investment" placeholder="e.g. $50,000"></div>
          <div class="form-group"><label class="form-label" id="lbl-loc">Location</label><input type="text" class="form-input" id="g-location" placeholder="e.g. Dubai, Remote, New York"></div>
          <div class="form-group"><label class="form-label" id="lbl-goals">Goals *</label><textarea class="form-textarea" id="g-goals" placeholder="What do you want to achieve in 12 months?" style="min-height:70px"></textarea></div>
          <button class="btn btn-primary" style="width:100%" id="gen-btn" onclick="doGenerate()">
            <span class="loader" id="g-loader" style="display:none"></span>
            <span class="gen-btn-text" id="gen-btn-txt">⚡ Generate Full Business Plan</span>
          </button>
        </div>
        <div>
          <div id="panel-result" class="result-panel" style="display:none">
            <button class="float-close-btn" onclick="closeResult()" title="Close">✕</button>
            <h4 id="result-title">Business Plan</h4>
            <div class="result-content" id="g-content"></div>
            <div class="result-actions">
              <button class="btn btn-secondary btn-sm" onclick="copyText(window._gResult)">Copy</button>
              <button class="btn btn-secondary btn-sm" onclick="exportReport(window._gReportId,'pdf')">↓ PDF</button>
              <button class="btn btn-secondary btn-sm" onclick="exportReport(window._gReportId,'docx')">↓ DOCX</button>
              <button class="btn btn-secondary btn-sm" onclick="closeResult()">← New</button>
            </div>
          </div>
          <div id="panel-history">
            <div class="section-hdr" style="margin-bottom:1rem"><h3 id="prev-title" style="font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:1px">PREVIOUS PLANS</h3></div>
            <div id="g-history" class="vault-grid">
              <div class="empty-state"><div class="empty-icon">⚡</div><p id="no-prev-txt">No plans generated yet</p></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../js/core.js"></script>
<script>
Auth.check(); buildLayout('generator');

function applyTranslations() {
  document.getElementById('page-title').textContent = t('gen.title');
  document.getElementById('form-title').textContent = t('gen.card_title');
  document.getElementById('lbl-name').textContent = t('gen.name');
  document.getElementById('lbl-industry').textContent = t('gen.industry');
  document.getElementById('lbl-model').textContent = t('gen.model');
  document.getElementById('lbl-market').textContent = t('gen.market');
  document.getElementById('lbl-invest').textContent = t('gen.investment');
  document.getElementById('lbl-loc').textContent = t('gen.location');
  document.getElementById('lbl-goals').textContent = t('gen.goals');
  document.getElementById('gen-btn-txt').textContent = t('gen.btn');
  document.getElementById('result-title').textContent = t('gen.result_title');
  document.getElementById('prev-title').textContent = t('gen.prev');
  document.getElementById('no-prev-txt').textContent = t('gen.no_prev');
  document.getElementById('mtab-form').textContent = '📝 '+(localStorage.getItem('d8_lang')==='ar'?'النموذج':'Form');
  document.getElementById('mtab-result').textContent = '⚡ '+(localStorage.getItem('d8_lang')==='ar'?'النتيجة':'Result');
  document.getElementById('mtab-history').textContent = '🕐 '+(localStorage.getItem('d8_lang')==='ar'?'السجل':'History');
}
applyTranslations();

function showMobToolTab(tab) {
  document.querySelectorAll('.mob-tool-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('mtab-'+tab).classList.add('active');
  document.getElementById('panel-form').style.display = tab==='form'?'block':'none';
  const res = document.getElementById('panel-result');
  const hist = document.getElementById('panel-history');
  if(tab==='result') { res.style.display='block'; hist.style.display='none'; }
  else if(tab==='history') { hist.style.display='block'; if(res) res.style.display='none'; }
  else { if(res&&window._gResult) res.style.display='block'; }
}

function closeResult() {
  document.getElementById('panel-result').style.display='none';
  document.getElementById('panel-history').style.display='block';
}

async function doGenerate() {
  const name=document.getElementById('g-name').value.trim();
  const industry=document.getElementById('g-industry').value.trim();
  const model=document.getElementById('g-model').value.trim();
  const market=document.getElementById('g-market').value.trim();
  const goals=document.getElementById('g-goals').value.trim();
  if(!name||!industry||!model||!market||!goals){Toast.show(t('msg.fill_required'),'error');return;}
  const btn=document.getElementById('gen-btn');
  const loaderEl=document.getElementById('g-loader');
  const txtEl=document.getElementById('gen-btn-txt');
  btn.disabled=true; loaderEl.style.display='inline-block'; txtEl.textContent=t('btn.generating');
  try {
    const data=await api.post('/generator/generate',{type:'business_plan',inputs:{businessName:name,industry,businessModel:model,targetMarket:market,investment:document.getElementById('g-investment').value,location:document.getElementById('g-location').value,goals}});
    if(data?.error) throw new Error(data.error);
    window._gResult=data.report.content; window._gReportId=data.report._id;
    document.getElementById('g-content').innerHTML=renderMarkdown(data.report.content);
    document.getElementById('panel-result').style.display='block';
    document.getElementById('panel-history').style.display='none';
    // On mobile, switch to result tab
    if(window.innerWidth<900) showMobToolTab('result');
    Toast.show(localStorage.getItem('d8_lang')==='ar'?'تم إنشاء خطة العمل!':'Business plan generated!','success');
  } catch(e){Toast.show(e.message,'error');}
  finally{btn.disabled=false;loaderEl.style.display='none';txtEl.textContent=t('gen.btn');}
}
async function loadHistory() {
  const d=await api.get('/generator/reports');
  if(!d?.reports?.length) return;
  document.getElementById('g-history').innerHTML=d.reports.map(r=>`<div class="vault-item"><div class="vault-item-header"><div class="vault-item-icon">⚡</div><div><div class="vault-item-title">${r.title}</div><div class="vault-item-meta">${timeAgo(r.createdAt)}</div></div></div></div>`).join('');
}
loadHistory();
</script>
</body>
</html>
