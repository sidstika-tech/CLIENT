<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Advisor — Double Eight AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.chat-layout{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 58px);}
.sessions-panel{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;position:relative;}
.sessions-header{padding:1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sessions-header h3{font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:1px;}
.sessions-list{flex:1;overflow-y:auto;padding:.5rem;}
.session-item{padding:.7rem .85rem;border-radius:8px;cursor:pointer;transition:.15s;border:1px solid transparent;}
.session-item:hover{background:var(--surface);border-color:var(--border);}
.session-item.active{background:var(--gold-dim);border-color:var(--border-gold);}
.session-title{font-size:.83rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.session-date{font-size:.72rem;color:var(--text3);margin-top:.2rem;}
.chat-area{display:flex;flex-direction:column;overflow:hidden;position:relative;}
.chat-topbar{padding:.75rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem;flex-shrink:0;}
.chat-topbar h4{font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:1px;}
.chip{background:var(--gold-dim);border:1px solid var(--border-gold);color:var(--gold);font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.06em;}
.starters{display:flex;flex-wrap:wrap;gap:.6rem;padding:1.5rem;align-self:center;max-width:680px;width:100%;margin:auto;}
.starter-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.65rem 1rem;font-size:.82rem;color:var(--text2);cursor:pointer;transition:.15s;text-align:left;}
.starter-btn:hover{border-color:var(--border-gold);color:var(--text);}
/* mobile */
.mobile-chat-tabs{display:none;background:var(--bg2);border-bottom:1px solid var(--border);padding:.5rem 1rem;gap:.5rem;}
.mob-tab{flex:1;padding:.5rem;border-radius:8px;font-size:.82rem;font-weight:600;border:1px solid var(--border);color:var(--text3);background:none;cursor:pointer;transition:.15s;font-family:'Outfit',sans-serif;}
.mob-tab.active{background:var(--gold-dim);border-color:var(--border-gold);color:var(--gold);}
.hist-close-btn{position:absolute;top:.85rem;right:-44px;background:var(--bg2);border:1px solid var(--border-gold);width:36px;height:36px;border-radius:9px;color:var(--text);font-size:1rem;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:201;}
[dir="rtl"] .chat-layout{direction:rtl;}
[dir="rtl"] .sessions-panel{border-right:none;border-left:1px solid var(--border);}
[dir="rtl"] .starter-btn{text-align:right;}
[dir="rtl"] .hist-close-btn{right:auto;left:-44px;}
@media(max-width:900px){
  .chat-layout{grid-template-columns:1fr;height:auto;flex-direction:column;}
  .sessions-panel{display:none;position:fixed;top:0;left:0;width:80%;max-width:300px;height:100vh;z-index:160;border-right:1px solid var(--border-gold);}
  [dir="rtl"] .sessions-panel{left:auto;right:0;border-right:none;border-left:1px solid var(--border-gold);}
  .sessions-panel.mob-show{display:flex;}
  .hist-close-btn{display:flex!important;}
  .mobile-chat-tabs{display:flex!important;}
  .chat-area{height:calc(100vh - 58px - 48px);}
}
</style>
</head>
<body>
<div class="app-grid-bg"></div>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeHistoryPanel()"></div>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="hamburger">☰</button>
      <span class="topbar-title" id="page-title">AI ADVISOR</span>
      <div class="topbar-right">
        <span class="chip" id="ai-chip">◎ Powered by Double Eight Ai</span>
        <button class="btn btn-secondary btn-sm" id="new-chat-btn" onclick="newSession()">+ New Chat</button>
      </div>
    </div>

    <div class="mobile-chat-tabs">
      <button class="mob-tab active" id="tab-chat" onclick="showMobTab('chat')" id="mob-chat-tab">💬 Chat</button>
      <button class="mob-tab" id="tab-history" onclick="showMobTab('history')" id="mob-hist-tab">🕐 History</button>
    </div>

    <div class="chat-layout">
      <div class="sessions-panel" id="sessions-panel">
        <button class="hist-close-btn" onclick="closeHistoryPanel()">✕</button>
        <div class="sessions-header">
          <h3 id="hist-title">HISTORY</h3>
          <button class="btn btn-secondary btn-sm" onclick="newSession()">+</button>
        </div>
        <div class="sessions-list" id="sessions-list">
          <div style="padding:1rem;font-size:.8rem;color:var(--text3)" id="sessions-loading">Loading...</div>
        </div>
      </div>

      <div class="chat-area" id="chat-area">
        <div class="chat-topbar">
          <div style="width:32px;height:32px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#080810;font-size:.9rem;flex-shrink:0">D8</div>
          <div>
            <h4 id="advisor-title">DOUBLE EIGHT ADVISOR</h4>
            <div id="advisor-sub" style="font-size:.72rem;color:var(--text3)">Expert AI for entrepreneurs &amp; founders</div>
          </div>
          <button class="btn btn-danger btn-sm" id="clear-btn" style="margin-left:auto;white-space:nowrap" onclick="clearSession()">Clear</button>
        </div>
        <div class="chat-messages" id="chat-messages">
          <div class="starters" id="starters">
            <div style="width:100%;text-align:center;margin-bottom:.75rem">
              <div id="starter-hdr" style="font-family:'Bebas Neue',cursive;font-size:1.6rem;color:var(--gold);letter-spacing:1px">WHAT CAN I HELP YOU BUILD?</div>
              <div id="starter-sub" style="font-size:.85rem;color:var(--text3)">Ask anything about business, strategy, or entrepreneurship</div>
            </div>
            <button class="starter-btn" onclick="sendStarter(this)" id="s1">📋 Create a business plan for a SaaS startup</button>
            <button class="starter-btn" onclick="sendStarter(this)" id="s2">📊 Analyze my market and find opportunities</button>
            <button class="starter-btn" onclick="sendStarter(this)" id="s3">💰 How should I price my product?</button>
            <button class="starter-btn" onclick="sendStarter(this)" id="s4">🎯 Review my pitch deck and give feedback</button>
            <button class="starter-btn" onclick="sendStarter(this)" id="s5">📢 Build a full marketing strategy for me</button>
            <button class="starter-btn" onclick="sendStarter(this)" id="s6">🚀 Create a 30-day launch roadmap</button>
            <button class="starter-btn" onclick="sendStarter(this)" id="s7">⚔ Who are my main competitors and how do I beat them?</button>
            <button class="starter-btn" onclick="sendStarter(this)" id="s8">💡 I have an idea, is it viable?</button>
          </div>
        </div>
        <div class="chat-input-wrap">
          <div id="attachment-preview" style="display:none;padding:.5rem 1rem;gap:.5rem;flex-wrap:wrap;border-bottom:1px solid var(--border)"></div>
          <div class="chat-input-row">
            <input type="file" id="file-upload" style="display:none" onchange="handleFileUpload(event)" accept="image/*,.pdf,.doc,.docx,.txt">
            <button class="chat-action-btn" onclick="document.getElementById('file-upload').click()" title="Upload Image or Document" style="background:none;border:none;color:var(--text3);font-size:1.2rem;cursor:pointer;padding:0 .5rem">📎</button>
            <textarea class="chat-textarea" id="chat-input" placeholder="Ask anything — business plans, strategy, pricing, marketing..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
            <button class="chat-send" onclick="sendMessage()" id="send-btn" title="Send">→</button>
          </div>
          <div id="chat-footer-note" style="text-align:center;font-size:.72rem;color:var(--text3);margin-top:.5rem">Double Eight AI · Expert Business Advisor</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/core.js"></script>
<script>
Auth.check();
buildLayout('chat');

function applyTranslations() {
  const isAr = localStorage.getItem('d8_lang')==='ar';
  document.getElementById('page-title').textContent = t('chat.title');
  document.getElementById('new-chat-btn').textContent = t('chat.new_chat');
  document.getElementById('hist-title').textContent = t('chat.history');
  document.getElementById('tab-chat').textContent = t('chat.tab_chat');
  document.getElementById('tab-history').textContent = t('chat.tab_history');
  document.getElementById('chat-input').placeholder = t('chat.placeholder');
  document.getElementById('clear-btn').textContent = isAr?'مسح':'Clear';
  if(isAr) {
    document.getElementById('advisor-title').textContent = 'مستشار دابل إيت';
    document.getElementById('advisor-sub').textContent = 'ذكاء اصطناعي خبير لرواد الأعمال';
    document.getElementById('starter-hdr').textContent = 'ماذا يمكنني أن أساعدك في بناؤه؟';
    document.getElementById('starter-sub').textContent = 'اسأل أي شيء عن الأعمال أو الاستراتيجية أو ريادة الأعمال';
    document.getElementById('s1').textContent = '📋 إنشاء خطة عمل لشركة SaaS ناشئة';
    document.getElementById('s2').textContent = '📊 تحليل سوقي وإيجاد الفرص';
    document.getElementById('s3').textContent = '💰 كيف أسعّر منتجي؟';
    document.getElementById('s4').textContent = '🎯 مراجعة عرض المستثمرين وتقديم الملاحظات';
    document.getElementById('s5').textContent = '📢 بناء استراتيجية تسويقية كاملة';
    document.getElementById('s6').textContent = '🚀 إنشاء خارطة طريق إطلاق لمدة 30 يوماً';
    document.getElementById('s7').textContent = '⚔ من هم منافسيّ الرئيسيون وكيف أتفوق عليهم؟';
    document.getElementById('s8').textContent = '💡 لديّ فكرة، هل هي قابلة للتطبيق؟';
    document.getElementById('sessions-loading').textContent = 'جارٍ التحميل...';
    document.getElementById('chat-footer-note').textContent = 'Double Eight AI · مستشار الأعمال الخبير';
  }
}
applyTranslations();

let currentSessionId=null, isStreaming=false, messages=[];
let attachedFile = null;

async function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  const isImage = file.type.startsWith('image/');
  const isDoc = !isImage && (file.type === 'application/pdf' || file.type.includes('word') || file.type === 'text/plain');
  
  const isArChat = localStorage.getItem('d8_lang') === 'ar';
  if (!isImage && !isDoc) {
    Toast.show(isArChat ? 'نوع الملف غير مدعوم. يرجى رفع صورة أو مستند (PDF, Word, نص).' : 'Unsupported file type. Please upload images or documents (PDF, Word, Text).', 'error');
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    Toast.show(isArChat ? 'الملف كبير جداً. الحد الأقصى 5 ميغابايت.' : 'File too large. Max 5MB.', 'error');
    return;
  }

  attachedFile = {
    file,
    type: isImage ? 'image' : 'doc',
    name: file.name
  };

  const preview = document.getElementById('attachment-preview');
  preview.style.display = 'flex';
  preview.innerHTML = `
    <div style="background:var(--surface2);border:1px solid var(--border-gold);border-radius:8px;padding:.4rem .8rem;display:flex;align-items:center;gap:.5rem;font-size:.8rem">
      <span>${isImage ? '🖼️' : '📄'} ${file.name}</span>
      <button onclick="removeAttachment()" style="background:none;border:none;color:var(--red);cursor:pointer;font-weight:bold">✕</button>
    </div>
  `;
}

function removeAttachment() {
  attachedFile = null;
  document.getElementById('attachment-preview').style.display = 'none';
  document.getElementById('file-upload').value = '';
}

function showMobTab(tab) {
  document.getElementById('tab-chat').classList.toggle('active',tab==='chat');
  document.getElementById('tab-history').classList.toggle('active',tab==='history');
  if(tab==='history') {
    document.getElementById('sessions-panel').classList.add('mob-show');
    document.getElementById('sidebar-overlay').classList.add('show');
  } else { closeHistoryPanel(); }
}
function closeHistoryPanel() {
  document.getElementById('sessions-panel').classList.remove('mob-show');
  document.getElementById('sidebar-overlay').classList.remove('show');
  document.getElementById('tab-chat').classList.add('active');
  document.getElementById('tab-history').classList.remove('active');
}

async function loadSessions() {
  const data=await api.get('/chat/sessions');
  const list=document.getElementById('sessions-list');
  const isAr=localStorage.getItem('d8_lang')==='ar';
  if(!data?.sessions?.length){
    list.innerHTML=`<div style="padding:1rem;font-size:.8rem;color:var(--text3)">${t('chat.no_sessions')}</div>`;return;
  }
  list.innerHTML=data.sessions.map(s=>`
    <div class="session-item ${s._id===currentSessionId?'active':''}" onclick="loadSession('${s._id}');closeHistoryPanel()">
      <div class="session-title">${s.title||(isAr?'محادثة جديدة':'New Conversation')}</div>
      <div class="session-date">${timeAgo(s.updatedAt)}</div>
    </div>`).join('');
}

async function loadSession(id) {
  const data=await api.get(`/chat/sessions/${id}`);
  if(!data?.session) return;
  currentSessionId=id; messages=data.session.messages||[];
  const container=document.getElementById('chat-messages');
  container.innerHTML='';
  messages.forEach(m=>appendMessage(m.role,m.content));
  container.scrollTop=container.scrollHeight;
  loadSessions();
}

function appendMessage(role,content,streaming=false) {
  const container=document.getElementById('chat-messages');
  const id='msg-'+Date.now()+Math.random();
  const div=document.createElement('div');
  div.className=`chat-msg ${role}`; div.id=id;
  const userInit=(Auth.user().name||'U')[0].toUpperCase();
  const avatar=role==='user'?`<div class="chat-avatar user">${userInit}</div>`:`<div class="chat-avatar ai">D8</div>`;
  div.innerHTML=`${avatar}<div class="chat-bubble" id="bubble-${id}">${role==='assistant'&&streaming?'<div class="typing-dots"><span></span><span></span><span></span></div>':renderMarkdown(content)}</div>`;
  container.appendChild(div);
  container.scrollTop=container.scrollHeight;
  return id;
}

function updateBubble(msgId,content) {
  const bubble=document.getElementById(`bubble-${msgId}`);
  if(bubble) bubble.innerHTML=renderMarkdown(content);
  document.getElementById('chat-messages').scrollTop=9999999;
}

async function sendMessage() {
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text||isStreaming) return;
  const starters=document.getElementById('starters');
  if(starters) starters.remove();
  input.value=''; input.style.height='auto';
  isStreaming=true;
  const sendBtn=document.getElementById('send-btn');
  sendBtn.innerHTML='<div class="typing-dots" style="padding:0"><span></span><span></span><span></span></div>';
  sendBtn.disabled=true;
  let imageData = null;
  let finalMessage = text;

  if (attachedFile) {
    if (attachedFile.type === 'image') {
      imageData = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(attachedFile.file);
      });
    } else {
      finalMessage += `\n\n[Attached Document: ${attachedFile.name}]`;
    }
  }

  const displayMessage = text + (attachedFile ? `\n\n(Attached: ${attachedFile.name})` : '');
  appendMessage('user', displayMessage);
  messages.push({role:'user',content:displayMessage});
  
  const aiMsgId=appendMessage('assistant','',true);
  let fullResponse='';
  
  const payload = {
    message: finalMessage,
    sessionId: currentSessionId,
    imageData: imageData
  };

  removeAttachment();

  try {
    const r=await fetch(`${API}/chat/message`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${Auth.token()}`},
      body:JSON.stringify(payload)
    });
    if(!r.ok) throw new Error('Server error');
    const reader=r.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true) {
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop();
      for(const line of lines) {
        if(!line.startsWith('data:')) continue;
        try {
          const d=JSON.parse(line.slice(5).trim());
          if(d.chunk){fullResponse+=d.chunk;updateBubble(aiMsgId,fullResponse);}
          if(d.sessionId) currentSessionId=d.sessionId;
          if(d.done) loadSessions();
        } catch{}
      }
    }
    if(fullResponse) messages.push({role:'assistant',content:fullResponse});
  } catch(err) {
    const isAr=localStorage.getItem('d8_lang')==='ar';
    updateBubble(aiMsgId,isAr?'عذراً، حدث خطأ. يرجى المحاولة مرة أخرى.':'Sorry, something went wrong. Please try again.');
    Toast.show('Failed to send message','error');
  } finally {
    isStreaming=false; sendBtn.innerHTML='→'; sendBtn.disabled=false;
  }
}

function sendStarter(btn) {
  document.getElementById('chat-input').value=btn.textContent.replace(/^[^\w\u0600-\u06FF]*/,'').trim();
  sendMessage();
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function newSession(){currentSessionId=null;messages=[];window.location.reload();}
function clearSession(){
  const isAr=localStorage.getItem('d8_lang')==='ar';
  if(confirm(isAr?'مسح هذه المحادثة؟':'Clear this conversation?')){currentSessionId=null;messages=[];window.location.reload();}
}

loadSessions();
</script>
</body>
</html>
