<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Business DNA — Double Eight AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
/* ── HERO ── */
.dna-hero{background:linear-gradient(135deg,rgba(168,85,247,.1),rgba(245,158,11,.04));border:1px solid var(--border-gold);border-radius:var(--radius-lg);padding:1.75rem 2rem;margin-bottom:1.5rem;position:relative;overflow:hidden}
.dna-hero::after{content:'🧬';position:absolute;right:1.5rem;top:50%;transform:translateY(-50%);font-size:5rem;opacity:.08;pointer-events:none}
.dna-hero h2{font-family:'Bebas Neue',cursive;font-size:1.8rem;letter-spacing:2px;color:var(--gold);margin-bottom:.4rem}
.dna-hero p{font-size:.9rem;color:var(--text2);line-height:1.65;max-width:680px}
/* ── FORM ── */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.35rem 1.6rem;margin-bottom:1rem;transition:.2s}
.q-card:focus-within{border-color:var(--border-gold);box-shadow:0 0 0 1px rgba(245,158,11,.15)}
.q-num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--gold-dim);color:var(--gold);align-items:center;justify-content:center;font-weight:700;font-size:.78rem;margin-right:.6rem}
[dir=rtl] .q-num{margin-right:0;margin-left:.6rem}
.q-label{font-size:1rem;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:.35rem;display:flex;align-items:flex-start}
.q-hint{font-size:.78rem;color:var(--text3);line-height:1.5;margin:.1rem 0 .85rem .1rem;padding-left:36px}
[dir=rtl] .q-hint{padding-left:0;padding-right:36px}
.q-input{width:100%;min-height:75px;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;color:var(--text);font-family:'Outfit',sans-serif;font-size:.92rem;resize:vertical;line-height:1.55}
.q-input:focus{outline:none;border-color:var(--gold);background:rgba(0,0,0,.3)}
.q-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.5rem;margin-top:.35rem}
.q-opt{background:rgba(0,0,0,.18);border:1px solid var(--border);border-radius:9px;padding:.65rem .85rem;color:var(--text2);font-size:.85rem;cursor:pointer;transition:.15s;text-align:left;font-family:'Outfit',sans-serif}
.q-opt:hover{border-color:var(--gold-dim);color:var(--text)}
.q-opt.selected{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
.id-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:1rem}
.id-input{background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:9px;padding:.6rem .85rem;color:var(--text);font-family:'Outfit',sans-serif;font-size:.9rem}
.id-input:focus{outline:none;border-color:var(--gold)}
@media(max-width:700px){.id-row{grid-template-columns:1fr}}
/* ── ACTIONS ── */
.actions-row{display:flex;gap:.6rem;justify-content:center;margin-top:1.5rem;flex-wrap:wrap}
.btn-mega{background:linear-gradient(135deg,var(--gold),#d97706);color:#0a0a0f;border:none;padding:1rem 2rem;border-radius:30px;font-weight:700;font-size:.95rem;cursor:pointer;font-family:'Outfit',sans-serif;letter-spacing:.04em;transition:.2s;display:inline-flex;align-items:center;gap:.5rem}
.btn-mega:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(245,158,11,.35)}
.btn-mega:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
/* ── OUTPUT SECTIONS ── */
.section-mirror,.section-path,.section-map{background:var(--surface);border:1px solid var(--border-gold);border-radius:var(--radius-lg);padding:1.5rem 1.75rem;margin-bottom:1.25rem;position:relative;overflow:hidden}
.section-mirror{background:linear-gradient(135deg,rgba(168,85,247,.07),transparent)}
.section-path{background:linear-gradient(135deg,rgba(245,158,11,.06),transparent)}
.section-map{background:linear-gradient(135deg,rgba(16,185,129,.05),transparent)}
.sec-tag{display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.12em;color:var(--gold);background:var(--gold-dim);padding:3px 10px;border-radius:20px;margin-bottom:.6rem;text-transform:uppercase}
.sec-title{font-family:'Bebas Neue',cursive;font-size:1.8rem;letter-spacing:1.5px;color:var(--text);margin-bottom:.4rem;line-height:1}
.sec-sub{font-size:.85rem;color:var(--text3);margin-bottom:1.4rem;font-style:italic}
.mirror-block{padding:1rem 1.2rem;background:rgba(0,0,0,.18);border-left:3px solid var(--gold);border-radius:8px;margin-bottom:1rem}
[dir=rtl] .mirror-block{border-left:none;border-right:3px solid var(--gold)}
.mirror-block.feature{background:linear-gradient(135deg,rgba(168,85,247,.12),rgba(168,85,247,.02));border-left-color:#a855f7;font-size:1.05rem;line-height:1.7;padding:1.25rem 1.4rem}
[dir=rtl] .mirror-block.feature{border-right-color:#a855f7}
.mb-label{font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:.4rem;display:block}
.mb-value{color:var(--text);font-size:.95rem;line-height:1.7}
.mb-meta{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.mb-pill{font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.04);color:var(--text2);border:1px solid var(--border)}
.mb-pill.gold{background:var(--gold-dim);color:var(--gold);border-color:var(--gold)}
/* ── PATH ── */
.path-name{font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:1px;color:var(--gold);line-height:1.15;margin-bottom:1.25rem;padding-bottom:.85rem;border-bottom:1px solid var(--border)}
.path-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
@media(max-width:700px){.path-grid{grid-template-columns:1fr}}
.path-block{padding:1rem 1.2rem;background:rgba(0,0,0,.15);border-radius:9px;border:1px solid var(--border)}
.path-block.span2{grid-column:1/-1;border-color:rgba(245,158,11,.25)}
.pb-label{font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:.4rem;display:block}
.pb-value{font-size:.88rem;color:var(--text2);line-height:1.65}
/* ── 30-DAY MAP ── */
.map-week{background:rgba(0,0,0,.18);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;margin-bottom:.8rem;position:relative}
.map-week::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:10px 0 0 10px}
[dir=rtl] .map-week::before{left:auto;right:0;border-radius:0 10px 10px 0}
.map-week.w1::before{background:#3b82f6}.map-week.w2::before{background:#f59e0b}.map-week.w3::before{background:#10b981}.map-week.w4::before{background:#a855f7}
.mw-theme{font-weight:700;font-size:.95rem;color:var(--text);margin-bottom:.7rem;display:flex;align-items:center;gap:.4rem}
.mw-actions{list-style:none;padding:0;margin:.5rem 0}
.mw-actions li{padding:.4rem 0 .4rem 22px;color:var(--text2);font-size:.85rem;line-height:1.55;position:relative}
.mw-actions li::before{content:'✓';position:absolute;left:0;color:var(--gold);font-weight:700}
[dir=rtl] .mw-actions li{padding-left:0;padding-right:22px}
[dir=rtl] .mw-actions li::before{left:auto;right:0}
.mw-avoid,.mw-trap{font-size:.78rem;padding:.5rem .75rem;margin-top:.5rem;border-radius:7px;line-height:1.5}
.mw-avoid{background:rgba(239,68,68,.07);border-left:2px solid #ef4444;color:#fca5a5}
.mw-trap{background:rgba(168,85,247,.07);border-left:2px solid #a855f7;color:#d8b4fe}
[dir=rtl] .mw-avoid{border-left:none;border-right:2px solid #ef4444}
[dir=rtl] .mw-trap{border-left:none;border-right:2px solid #a855f7}
.mw-avoid strong,.mw-trap strong{display:block;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.2rem;opacity:.85}
/* ── CLOSING ── */
.closing-strip{background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(245,158,11,.02));border:1px solid var(--border-gold);border-radius:var(--radius-lg);padding:1.4rem 1.75rem;margin-bottom:1rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:700px){.closing-strip{grid-template-columns:1fr}}
.cs-item .cs-lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:.3rem;display:block}
.cs-item .cs-val{font-size:1rem;color:var(--text);line-height:1.5;font-weight:500}
.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.2rem;margin-bottom:1rem}
@media(max-width:700px){.score-grid{grid-template-columns:repeat(2,1fr)}}
.score-cell{text-align:center}
.score-num{font-family:'Bebas Neue',cursive;font-size:1.8rem;color:var(--gold);line-height:1}
.score-lbl{font-size:.65rem;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-top:.25rem}
.next-action{background:var(--surface);border:1px dashed var(--border-gold);border-radius:10px;padding:1rem 1.2rem;text-align:center;margin-top:1rem}
.next-action a{display:inline-block;margin-top:.5rem;padding:.7rem 1.5rem;background:var(--gold);color:#0a0a0f;border-radius:25px;font-weight:600;text-decoration:none;font-size:.88rem}
</style>

<body>
<div class="app-grid-bg"></div><div class="page-particles"></div>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="hamburger">☰</button>
      <span class="topbar-title">BUSINESS DNA</span>
      <div class="topbar-right"></div>
    </div>
    <div class="page-content">
      <div class="dna-hero">
        <h2 id="hero-title">🧬 YOUR BUSINESS DNA</h2>
        <p id="hero-sub">This isn't a quiz that matches you to an industry. It's a reading. Answer 9 honest questions and we'll show you who you actually are, what hidden strengths your words reveal, and the one path that fits your nature.</p>
      </div>

      <div id="form-wrap"></div>
      <div id="result-wrap" style="display:none"></div>
    </div>
  </div>
</div>
<script src="../js/core.js"></script>
<script>
Auth.check();
buildLayout('dna');

const isAr = () => localStorage.getItem('d8_lang') === 'ar';
const QS = (en, ar) => isAr() ? ar : en;

// Natural medium options
const MEDIA = [
  { v:'people',   en:'👥 Working with people',   ar:'👥 العمل مع الناس' },
  { v:'products', en:'📦 Working with products', ar:'📦 العمل مع المنتجات' },
  { v:'content',  en:'✍️ Working with content',  ar:'✍️ العمل مع المحتوى' },
  { v:'systems',  en:'⚙ Working with systems',  ar:'⚙ العمل مع الأنظمة' },
  { v:'tech',     en:'💻 Working with tech',     ar:'💻 العمل مع التقنية' },
  { v:'hands',    en:'🤲 Working with hands',    ar:'🤲 عمل يدوي/جسدي' },
  { v:'art',      en:'🎨 Working with art',      ar:'🎨 العمل الفني/الإبداعي' },
  { v:'mix',      en:'🔀 A mix — variety',       ar:'🔀 خليط — أحب التنوع' },
];

const BUDGETS = [
  { v:'<500',      en:'Under $500',         ar:'أقل من 500 دولار' },
  { v:'500-2000',  en:'$500 - $2,000',     ar:'500 - 2,000 دولار' },
  { v:'2000-10000',en:'$2,000 - $10,000',  ar:'2,000 - 10,000 دولار' },
  { v:'10000-50000',en:'$10,000 - $50,000', ar:'10,000 - 50,000 دولار' },
  { v:'50000+',    en:'$50,000+',          ar:'50,000 دولار أو أكثر' },
];

const QUESTIONS = [
  { id:'proudOf',
    label_en:'Tell us about something you built, fixed, organized, or created — that you\'re quietly proud of.',
    label_ar:'احكي لنا عن شيء بنيته، أصلحته، نظّمته، أو ابتكرته وأنت فخور به بهدوء.',
    hint_en:'Doesn\'t have to be business-related. A meal, a trip you planned, a problem you solved at work, a habit you fixed.',
    hint_ar:'لا يجب أن يكون متعلقاً بالأعمال. وجبة، رحلة خططتَ لها، مشكلة حللتها في العمل، عادة أصلحتها.' },
  { id:'energySource',
    label_en:'When do you feel most alive — talking to a room full of new people all day, or sitting alone solving a complex puzzle for hours?',
    label_ar:'متى تشعر بأنك في قمة حيويتك — وأنت تتحدث مع أناس جدد طوال اليوم، أم وحدك تحل مشكلة معقدة لساعات؟',
    hint_en:'Be honest. There\'s no right answer.',
    hint_ar:'كن صادقاً. لا توجد إجابة صحيحة.' },
  { id:'couldDoBetter',
    label_en:'What\'s one product, service, or habit in the world that makes you think "this is so stupid — I could do this better"?',
    label_ar:'ما المنتج أو الخدمة أو العادة في العالم التي تجعلك تقول "هذا غباء — أستطيع أن أفعلها أفضل"؟',
    hint_en:'Don\'t filter yourself. The thing that annoys you is usually the thing you\'re meant to fix.',
    hint_ar:'لا تفلتر نفسك. الشيء الذي يزعجك عادة هو الذي خُلقت لتصلحه.' },
  { id:'peopleAskFor',
    label_en:'What do friends, family, or coworkers keep coming to YOU for — advice, help, opinions, favors?',
    label_ar:'لماذا يأتي إليك الأصدقاء والعائلة وزملاء العمل — نصيحة، مساعدة، رأي، خدمة؟',
    hint_en:'This reveals what you\'re already known for, even if you\'ve never charged for it.',
    hint_ar:'هذا يكشف ما أنت معروف به فعلاً، حتى لو لم تطلب مقابله أبداً.' },
  { id:'whatYouHate',
    label_en:'What kind of work drains the life out of you — even when you\'re good at it?',
    label_ar:'أي نوع من العمل يستنزف حياتك — حتى لو كنت بارعاً فيه؟',
    hint_en:'The work you hate is more important than the work you love. Building around it guarantees failure.',
    hint_ar:'العمل الذي تكرهه أهم من الذي تحبه. البناء حوله يضمن الفشل.' },
  { id:'whatStopsYou',
    label_en:'What\'s actually stopping you from starting right now? Be honest — money, fear, no idea, no time, family pressure, or something else?',
    label_ar:'ما الذي يمنعك فعلاً من أن تبدأ الآن؟ كن صادقاً — المال، الخوف، عدم وجود فكرة، عدم وجود وقت، ضغط الأهل، أو شيء آخر؟',
    hint_en:'The real obstacle, not the polite one.',
    hint_ar:'العائق الحقيقي، ليس المهذب.' },
  { id:'successLooksLike',
    label_en:'If everything went right in the next 12 months — describe one normal Tuesday a year from now. Where you wake up, what you do, who you see.',
    label_ar:'لو سارت الأمور كما تتمنى خلال السنة القادمة — صف لنا يوم ثلاثاء عادي بعد سنة من الآن. أين تستيقظ، ماذا تفعل، من تقابل.',
    hint_en:'Don\'t say "I want to be rich." Describe the actual day.',
    hint_ar:'لا تقل "أريد أن أصبح غنياً". صف اليوم الفعلي.' },
];

function buildForm() {
  const ar = isAr();
  const html = `
    <div class="q-card">
      <div class="q-label">${QS('First, just so we can talk to you personally:', 'أولاً، لكي نتحدث معك شخصياً:')}</div>
      <div class="id-row">
        <input class="id-input" id="f-name" placeholder="${QS('Your name','اسمك')}">
        <input class="id-input" id="f-country" placeholder="${QS('Country (Saudi Arabia, UAE, Egypt...)','الدولة')}">
        <input class="id-input" id="f-city" placeholder="${QS('City (optional)','المدينة (اختياري)')}">
      </div>
    </div>

    ${QUESTIONS.map((q,i)=>`
      <div class="q-card">
        <div class="q-label"><span class="q-num">${i+1}</span><span>${ar?q.label_ar:q.label_en}</span></div>
        <div class="q-hint">${ar?q.hint_ar:q.hint_en}</div>
        <textarea class="q-input" id="f-${q.id}" placeholder="${QS('Write honestly. 2-4 sentences is perfect.','اكتب بصدق. 2-4 جمل تكفي.')}"></textarea>
      </div>
    `).join('')}

    <div class="q-card">
      <div class="q-label"><span class="q-num">8</span><span>${QS('When you imagine yourself working — what feels most natural?','عندما تتخيل نفسك تعمل — ما الذي يبدو طبيعياً لك أكثر؟')}</span></div>
      <div class="q-hint">${QS('Pick the one that fits best.','اختر الأقرب إليك.')}</div>
      <div class="q-options" id="f-naturalMedium">
        ${MEDIA.map(m=>`<button type="button" class="q-opt" data-v="${m.v}" onclick="pickOpt(this,'naturalMedium')">${ar?m.ar:m.en}</button>`).join('')}
      </div>
    </div>

    <div class="q-card">
      <div class="q-label"><span class="q-num">9</span><span>${QS('What\'s the realistic budget you can put into this in the next 90 days — without hurting your life?','ما الميزانية الواقعية التي يمكنك تخصيصها خلال الـ90 يوماً القادمة — دون أن تؤذي حياتك؟')}</span></div>
      <div class="q-options" id="f-budget">
        ${BUDGETS.map(b=>`<button type="button" class="q-opt" data-v="${b.v}" onclick="pickOpt(this,'budget')">${ar?b.ar:b.en}</button>`).join('')}
      </div>
    </div>

    <div class="actions-row">
      <button class="btn-mega" id="gen-btn" onclick="generate()">
        <span id="gen-text">🧬 ${QS('Read Me','اقرأني')}</span>
      </button>
    </div>
  `;
  document.getElementById('form-wrap').innerHTML = html;
}

const picked = { naturalMedium: '', budget: '' };
function pickOpt(btn, key) {
  picked[key] = btn.dataset.v;
  btn.parentNode.querySelectorAll('.q-opt').forEach(b => b.classList.toggle('selected', b === btn));
}

async function generate() {
  const get = id => document.getElementById('f-' + id).value.trim();
  const name = get('name');
  const country = get('country');
  if (!name) return Toast.show(QS('Please enter your name', 'فضلاً أدخل اسمك'), 'error');
  if (!country) return Toast.show(QS('Please enter your country', 'فضلاً أدخل دولتك'), 'error');

  const answers = {
    proudOf: get('proudOf'),
    energySource: get('energySource'),
    couldDoBetter: get('couldDoBetter'),
    peopleAskFor: get('peopleAskFor'),
    whatYouHate: get('whatYouHate'),
    whatStopsYou: get('whatStopsYou'),
    successLooksLike: get('successLooksLike'),
    naturalMedium: picked.naturalMedium,
    budget: picked.budget,
  };
  for (const [k, v] of Object.entries(answers)) {
    if (!v || v.length < 3) return Toast.show(QS('Please answer every question', 'فضلاً أجب على كل الأسئلة'), 'error');
  }

  const btn = document.getElementById('gen-btn');
  const t = document.getElementById('gen-text');
  btn.disabled = true;
  t.innerHTML = `<span class="loader" style="width:14px;height:14px;border-width:2px;display:inline-block;margin-right:6px"></span>${QS('Reading you... 15-30 seconds','جارٍ قراءتك... 15-30 ثانية')}`;

  const r = await api.post('/business-dna/generate', {
    name, country, city: get('city'), language: localStorage.getItem('d8_lang') || 'en',
    answers,
  });

  btn.disabled = false;
  t.textContent = '🧬 ' + QS('Read Me', 'اقرأني');

  if (!r?.success) {
    Toast.show(r?.error || QS('Generation failed. Please try again.','فشل التوليد. حاول مرة أخرى.'), 'error');
    return;
  }
  renderResult(r.dna);
}

function renderResult(dna) {
  document.getElementById('form-wrap').style.display = 'none';
  const wrap = document.getElementById('result-wrap');
  wrap.style.display = 'block';

  const ar = isAr();
  const p = dna.profile || {};
  const pa = dna.path || {};
  const m = dna.thirtyDayMap || {};
  const s = dna.scores || {};

  wrap.innerHTML = `
    <!-- ──── THE MIRROR ──── -->
    <div class="section-mirror">
      <span class="sec-tag">${ar?'المرآة':'THE MIRROR'}</span>
      <h2 class="sec-title">${ar?'من أنت فعلاً':'WHO YOU ACTUALLY ARE'}</h2>
      <p class="sec-sub">${ar?'هذا ما كشفته إجاباتك — لا ما كتبته. اقرأ ببطء.':'This is what your answers revealed — not what you typed. Read slowly.'}</p>

      <div class="mirror-block feature">
        <span class="mb-label">${ar?'تشخيصك النفسي':'THE READ'}</span>
        <div class="mb-value">${escapeHtml(p.whoYouAre)}</div>
        <div class="mb-meta">
          <span class="mb-pill gold">${escapeHtml(p.workStyle)}</span>
          <span class="mb-pill">${escapeHtml(p.energyType)}</span>
        </div>
      </div>

      <div class="mirror-block">
        <span class="mb-label">${ar?'قوتك الحقيقية':'YOUR REAL STRENGTH'}</span>
        <div class="mb-value">${escapeHtml(p.realStrength)}</div>
      </div>

      <div class="mirror-block">
        <span class="mb-label">${ar?'ما يحرّكك حقاً':'WHAT ACTUALLY DRIVES YOU'}</span>
        <div class="mb-value">${escapeHtml(p.motivationFuel)}</div>
      </div>

      <div class="mirror-block">
        <span class="mb-label">${ar?'حمضك النووي للمخاطرة':'YOUR RISK DNA'}</span>
        <div class="mb-value">${escapeHtml(p.riskDNA)}</div>
      </div>

      <div class="mirror-block" style="border-left-color:#ef4444">
        <span class="mb-label" style="color:#f87171">${ar?'تجنّب بأي ثمن':'AVOID AT ALL COST'}</span>
        <div class="mb-value">${escapeHtml(p.avoidAtAllCost)}</div>
      </div>
    </div>

    <!-- ──── THE PATH ──── -->
    <div class="section-path">
      <span class="sec-tag">${ar?'الطريق':'THE PATH'}</span>
      <h2 class="sec-title">${ar?'طريق المقاومة الأقل':'THE ROAD OF LEAST RESISTANCE'}</h2>
      <p class="sec-sub">${ar?'الطريق الذي يناسب نفسيتك أولاً، والسوق ثانياً.':'The path that fits your psychology first, market second.'}</p>

      <div class="path-name">${escapeHtml(pa.name)}</div>

      <div class="path-grid">
        <div class="path-block span2">
          <span class="pb-label">${ar?'لماذا هذا الطريق':'WHY THIS PATH'}</span>
          <div class="pb-value">${escapeHtml(pa.whyThisPath)}</div>
        </div>
        <div class="path-block span2" style="background:rgba(239,68,68,.04);border-color:rgba(239,68,68,.2)">
          <span class="pb-label" style="color:#f87171">${ar?'لماذا ليس ما كنت تفكر فيه':'WHY NOT WHAT YOU WERE THINKING'}</span>
          <div class="pb-value">${escapeHtml(pa.whyNotAnotherPath)}</div>
        </div>
        <div class="path-block">
          <span class="pb-label">${ar?'الفرصة في السوق':'THE MARKET FIT'}</span>
          <div class="pb-value">${escapeHtml(pa.marketFit)}</div>
        </div>
        <div class="path-block">
          <span class="pb-label">${ar?'ميزتك التي لا تُقلّد':'YOUR UNFAIR ADVANTAGE'}</span>
          <div class="pb-value">${escapeHtml(pa.unfairAdvantage)}</div>
        </div>
        <div class="path-block span2">
          <span class="pb-label">${ar?'التكلفة الحقيقية':'THE REAL COST (BE HONEST WITH YOURSELF)'}</span>
          <div class="pb-value">${escapeHtml(pa.realCost)}</div>
        </div>
      </div>
    </div>

    <!-- ──── 30-DAY MAP ──── -->
    <div class="section-map">
      <span class="sec-tag">${ar?'الخريطة':'THE MAP'}</span>
      <h2 class="sec-title">${ar?'خريطة 30 يوماً ضد الفشل':'THE 30-DAY FAILURE-PROOF MAP'}</h2>
      <p class="sec-sub">${ar?'مصمّم خصيصاً لشخصيتك. أسبوعاً بأسبوع.':'Designed for your specific personality. Week by week.'}</p>
      ${renderWeek('w1', m.week1_detective)}
      ${renderWeek('w2', m.week2_smallAsk)}
      ${renderWeek('w3', m.week3_firstDollar)}
      ${renderWeek('w4', m.week4_scale)}
    </div>

    <!-- ──── CLOSING STRIP ──── -->
    <div class="closing-strip">
      <div class="cs-item">
        <span class="cs-lbl">${ar?'أول إنجاز خلال 30 يوماً':'FIRST MILESTONE IN 30 DAYS'}</span>
        <div class="cs-val">${escapeHtml(dna.firstMilestone)}</div>
      </div>
      <div class="cs-item">
        <span class="cs-lbl">${ar?'دخل واقعي (الشهر السادس)':'REALISTIC MONTH 6 REVENUE'}</span>
        <div class="cs-val">${escapeHtml(dna.realisticRevenue)}</div>
      </div>
    </div>

    <div class="score-grid">
      <div class="score-cell"><div class="score-num">${s.overall||0}</div><div class="score-lbl">${ar?'الجاهزية':'Overall'}</div></div>
      <div class="score-cell"><div class="score-num">${s.psychologyFit||0}</div><div class="score-lbl">${ar?'ملاءمة نفسية':'Psych Fit'}</div></div>
      <div class="score-cell"><div class="score-num">${s.marketViability||0}</div><div class="score-lbl">${ar?'قابلية السوق':'Market'}</div></div>
      <div class="score-cell"><div class="score-num">${s.executionFit||0}</div><div class="score-lbl">${ar?'جاهزية التنفيذ':'Execution'}</div></div>
      <div class="score-cell"><div class="score-num">${s.riskBalance||0}</div><div class="score-lbl">${ar?'توازن المخاطر':'Risk'}</div></div>
    </div>

    <div class="next-action">
      <div style="font-size:.92rem;color:var(--text2);line-height:1.6">${ar?'هويتك جاهزة. الخطوة القادمة: نبني لك حزمة الإطلاق الكاملة بناءً على شخصيتك.':'Your DNA is read. Next step: we build your full Launch Package — 8 documents shaped by your psychology.'}</div>
      <a href="launch-package.html">${ar?'افتح حزمة الإطلاق →':'Open Launch Package →'}</a>
    </div>

    <div class="actions-row">
      <button class="btn btn-secondary" onclick="resetDNA()">↻ ${ar?'إعادة التحليل':'Re-read me'}</button>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderWeek(cls, w) {
  if (!w) return '';
  const ar = isAr();
  return `
    <div class="map-week ${cls}">
      <div class="mw-theme">${escapeHtml(w.theme)}</div>
      <ul class="mw-actions">${(w.actions||[]).map(a=>`<li>${escapeHtml(a)}</li>`).join('')}</ul>
      ${w.avoid?`<div class="mw-avoid"><strong>${ar?'تجنّب':'AVOID'}</strong>${escapeHtml(w.avoid)}</div>`:''}
      ${w.psychTrap?`<div class="mw-trap"><strong>${ar?'الفخ النفسي':'PSYCH TRAP'}</strong>${escapeHtml(w.psychTrap)}</div>`:''}
    </div>`;
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function resetDNA() {
  if (!confirm(QS('Reset your DNA and answer the questions again?','إعادة تعيين هويتك والإجابة من جديد؟'))) return;
  await api.del('/business-dna/reset');
  location.reload();
}

// On load, check if DNA already exists
async function init() {
  const d = await api.get('/business-dna');
  if (d?.dna && d.dna.completedAt) {
    renderResult(d.dna);
  } else {
    buildForm();
  }
}
init();
</script>
