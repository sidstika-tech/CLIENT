<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Business DNA — Double Eight AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
/* ── DNA PAGE ── */
.dna-hero{background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(245,158,11,.05));border:1px solid rgba(99,102,241,.2);border-radius:var(--radius-lg);padding:2rem;margin-bottom:2rem;text-align:center;}
.dna-hero h2{font-family:'Bebas Neue',cursive;font-size:2rem;letter-spacing:1.5px;margin-bottom:.4rem;}
.dna-hero p{font-size:.9rem;color:var(--text2);max-width:520px;margin:0 auto;}
/* ── FORM ── */
.dna-form-wrap{max-width:720px;margin:0 auto;}
.dna-step{margin-bottom:2.5rem;}
.dna-step-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;}
.dna-step-num{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#818cf8);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',cursive;font-size:1.2rem;color:#fff;flex-shrink:0;}
.dna-step-title{font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:1px;color:var(--text);}
.dna-step-sub{font-size:.78rem;color:var(--text3);}
/* option pills */
.pill-grid{display:flex;flex-wrap:wrap;gap:.6rem;}
.pill-opt{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.55rem 1rem;font-size:.83rem;color:var(--text2);cursor:pointer;transition:.2s;user-select:none;}
.pill-opt:hover{border-color:rgba(99,102,241,.4);color:var(--text);}
.pill-opt.selected{background:rgba(99,102,241,.12);border-color:#6366f1;color:#818cf8;font-weight:600;}
.pill-opt.gold.selected{background:rgba(245,158,11,.12);border-color:var(--gold);color:var(--gold);}
/* ── RESULT CARD ── */
.dna-result{max-width:820px;margin:0 auto;}
.score-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.75rem;margin-bottom:1.25rem;}
.score-big{display:flex;align-items:center;gap:2rem;flex-wrap:wrap;}
.score-circle{width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
.score-circle svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.score-num{font-family:'Bebas Neue',cursive;font-size:2.2rem;color:var(--gold);letter-spacing:1px;position:relative;z-index:1;}
.score-lbl{font-size:.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;position:relative;z-index:1;}
.score-right{flex:1;}
.score-right h3{font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:1px;color:var(--text);margin-bottom:.35rem;}
.score-right .match-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#818cf8;margin-bottom:.4rem;}
.score-right p{font-size:.875rem;color:var(--text2);line-height:1.7;}
/* radar bars */
.radar-bars{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-top:1.25rem;}
.radar-bar-item{display:flex;flex-direction:column;gap:.3rem;}
.radar-bar-label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--text2);}
.radar-bar-track{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.radar-bar-fill{height:100%;border-radius:3px;transition:width 1s ease;}
/* info cards */
.dna-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem;}
.dna-info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;}
.dna-info-card h4{font-family:'Bebas Neue',cursive;font-size:.95rem;letter-spacing:1px;margin-bottom:.65rem;}
.dna-info-card p,.dna-info-card li{font-size:.83rem;color:var(--text2);line-height:1.7;}
.dna-info-card ul{padding-left:1rem;}
.dna-info-card li{margin-bottom:.3rem;}
.dna-info-card.highlight{border-color:var(--border-gold);background:rgba(245,158,11,.04);}
.dna-info-card.highlight h4{color:var(--gold);}
.dna-info-card.purple{border-color:rgba(99,102,241,.3);background:rgba(99,102,241,.04);}
.dna-info-card.purple h4{color:#818cf8;}
.dna-info-card.green{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.04);}
.dna-info-card.green h4{color:#4ade80;}
.dna-info-card.red{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.04);}
.dna-info-card.red h4{color:#f87171;}
/* steps list */
.steps-list{display:flex;flex-direction:column;gap:.6rem;}
.step-item{display:flex;gap:.85rem;align-items:flex-start;padding:.75rem;background:var(--surface2);border-radius:9px;}
.step-item-num{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#080810;flex-shrink:0;margin-top:1px;}
.step-item-text{font-size:.83rem;color:var(--text2);line-height:1.55;}
/* journey bar */
.journey-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1.25rem;}
.journey-bar h4{font-family:'Bebas Neue',cursive;font-size:.95rem;letter-spacing:1px;color:var(--gold);margin-bottom:1rem;}
.journey-stages{display:flex;align-items:center;gap:0;}
.j-stage{flex:1;text-align:center;position:relative;}
.j-stage-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--bg2);margin:0 auto .4rem;display:flex;align-items:center;justify-content:center;font-size:.7rem;transition:.3s;position:relative;z-index:1;}
.j-stage.done .j-stage-dot{background:var(--gold);border-color:var(--gold);color:#080810;}
.j-stage.current .j-stage-dot{border-color:#6366f1;background:rgba(99,102,241,.2);color:#818cf8;box-shadow:0 0 12px rgba(99,102,241,.4);}
.j-stage-label{font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.j-stage.done .j-stage-label,.j-stage.current .j-stage-label{color:var(--text2);}
.j-line{position:absolute;top:14px;left:50%;right:-50%;height:2px;background:var(--border);z-index:0;}
.j-stage.done .j-line{background:var(--gold);}
/* action buttons */
.dna-actions{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.5rem;}
/* generating state */
.generating-overlay{text-align:center;padding:3rem 2rem;}
.gen-spinner{width:60px;height:60px;border:3px solid rgba(245,158,11,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1.5rem;}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-steps{display:flex;flex-direction:column;gap:.5rem;max-width:320px;margin:1.5rem auto 0;text-align:left;}
.gen-step-row{display:flex;align-items:center;gap:.65rem;font-size:.82rem;color:var(--text3);}
.gen-step-row.active{color:var(--text);}
.gen-step-row .gsr-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;}
.gen-step-row.active .gsr-dot{background:var(--gold);animation:pulse 1s infinite;}
.gen-step-row.done .gsr-dot{background:#22c55e;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* risk badge */
.risk-badge{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.06em;}
.risk-low{background:rgba(34,197,94,.15);color:#4ade80;}
.risk-medium{background:rgba(245,158,11,.15);color:var(--gold);}
.risk-high{background:rgba(239,68,68,.15);color:#f87171;}
@media(max-width:700px){
  .dna-info-grid{grid-template-columns:1fr;}
  .radar-bars{grid-template-columns:1fr;}
  .score-big{flex-direction:column;align-items:flex-start;gap:1rem;}
  .journey-stages{overflow-x:auto;}
}
</style>
</head>
<body>
<div class="app-grid-bg"></div>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="hamburger">☰</button>
      <span class="topbar-title">BUSINESS DNA</span>
      <div class="topbar-right">
        <span style="font-size:.78rem;color:var(--text3)" id="dna-status-label">Your personalized business match</span>
      </div>
    </div>
    <div class="page-content">
      <div id="dna-view"><!-- injected by JS --></div>
    </div>
  </div>
</div>

<script src="../js/core.js"></script>
<script>
Auth.check();
buildLayout('dna');

const COUNTRIES = ['UAE','Saudi Arabia','Egypt','Jordan','Morocco','Kuwait','Qatar','Bahrain','Oman','Lebanon','Tunisia','Algeria','Libya','Iraq','Syria','Yemen','Palestine','Sudan','Other'];
const INDUSTRIES = ['Technology / SaaS','E-Commerce / Retail','Food & Beverage','Healthcare / Medical','Education / EdTech','Real Estate','Consulting / Services','Marketing / Creative Agency','Fitness / Wellness','Finance / Fintech','Construction / Contracting','Tourism / Hospitality','Logistics / Delivery','Fashion / Beauty','Media / Content','Legal / Professional Services','Other'];
const BUDGETS = ['Under $1,000','$1,000 – $5,000','$5,000 – $15,000','$15,000 – $50,000','$50,000 – $150,000','$150,000+'];
const TIME_OPTIONS = ['5–10 hours/week (side project)','10–20 hours/week (part-time)','20–35 hours/week (serious)','Full-time (40+ hours/week)'];
const EXPERIENCE = ['Complete beginner — no business background','Some knowledge — read books, took courses','Worked in a company — understand operations','Previously launched something — learned from it','Serial entrepreneur — multiple ventures'];

let formData = {};
let currentDNA = null;

// ── INIT ──────────────────────────────────────────────────────────────────
async function init() {
  const d = await api.get('/business-dna');
  if(d?.dna?.matchResult?.businessMatch) {
    currentDNA = d.dna;
    showResult(d.dna);
  } else {
    showForm();
  }
}

// ── FORM VIEW ─────────────────────────────────────────────────────────────
function showForm() {
  document.getElementById('dna-status-label').textContent = 'Answer 8 questions — get your business match';
  document.getElementById('dna-view').innerHTML = `
    <div class="dna-hero">
      <h2>🧬 DISCOVER YOUR PERFECT BUSINESS</h2>
      <p>Answer 8 quick questions. Our AI analyzes your skills, budget, country, and goals — then tells you exactly what business to build and how to start.</p>
      <div style="font-size:.78rem;color:var(--text3);margin-top:.75rem">⏱ Takes about 3 minutes · Completely personalized to you</div>
    </div>
    <div class="dna-form-wrap">
      <!-- Q1: Name -->
      <div class="dna-step">
        <div class="dna-step-header">
          <div class="dna-step-num">1</div>
          <div><div class="dna-step-title">What is your name?</div><div class="dna-step-sub">We personalize your results with your name</div></div>
        </div>
        <div class="form-group"><input type="text" class="form-input" id="q-name" placeholder="Your full name" value="${Auth.user().name||''}"></div>
      </div>
      <!-- Q2: Country -->
      <div class="dna-step">
        <div class="dna-step-header">
          <div class="dna-step-num">2</div>
          <div><div class="dna-step-title">Where are you based?</div><div class="dna-step-sub">We tailor advice to your specific market</div></div>
        </div>
        <div class="pill-grid" id="country-pills">
          ${COUNTRIES.map(c=>`<div class="pill-opt" onclick="selectPill('country','${c}',this)">${c}</div>`).join('')}
        </div>
        <input type="text" class="form-input" id="q-city" placeholder="Your city (optional)" style="margin-top:.75rem">
      </div>
      <!-- Q3: Industry -->
      <div class="dna-step">
        <div class="dna-step-header">
          <div class="dna-step-num">3</div>
          <div><div class="dna-step-title">What industry interests you?</div><div class="dna-step-sub">Pick the one closest to your passion or idea</div></div>
        </div>
        <div class="pill-grid" id="industry-pills">
          ${INDUSTRIES.map(i=>`<div class="pill-opt" onclick="selectPill('industry','${i}',this)">${i}</div>`).join('')}
        </div>
      </div>
      <!-- Q4: Skills -->
      <div class="dna-step">
        <div class="dna-step-header">
          <div class="dna-step-num">4</div>
          <div><div class="dna-step-title">What are your strongest skills?</div><div class="dna-step-sub">Be honest — this is the most important question</div></div>
        </div>
        <textarea class="form-textarea" id="q-skills" placeholder="e.g. I'm good at sales and talking to people. I have 5 years in marketing. I know how to build websites. I'm great with numbers and Excel. I speak Arabic and English fluently..." style="min-height:90px"></textarea>
      </div>
      <!-- Q5: Budget -->
      <div class="dna-step">
        <div class="dna-step-header">
          <div class="dna-step-num">5</div>
          <div><div class="dna-step-title">What is your starting budget?</div><div class="dna-step-sub">Be realistic — we build a plan that fits</div></div>
        </div>
        <div class="pill-grid" id="budget-pills">
          ${BUDGETS.map(b=>`<div class="pill-opt gold" onclick="selectPill('budget','${b}',this)">${b}</div>`).join('')}
        </div>
      </div>
      <!-- Q6: Time -->
      <div class="dna-step">
        <div class="dna-step-header">
          <div class="dna-step-num">6</div>
          <div><div class="dna-step-title">How much time can you dedicate?</div><div class="dna-step-sub">Honesty here saves you from the wrong business model</div></div>
        </div>
        <div class="pill-grid" id="time-pills">
          ${TIME_OPTIONS.map(t=>`<div class="pill-opt" onclick="selectPill('timeAvailable','${t}',this)">${t}</div>`).join('')}
        </div>
      </div>
      <!-- Q7: Experience -->
      <div class="dna-step">
        <div class="dna-step-header">
          <div class="dna-step-num">7</div>
          <div><div class="dna-step-title">Your business experience level?</div><div class="dna-step-sub">No judgment — every founder starts somewhere</div></div>
        </div>
        <div class="pill-grid" id="exp-pills">
          ${EXPERIENCE.map(e=>`<div class="pill-opt" onclick="selectPill('experience','${e}',this)">${e}</div>`).join('')}
        </div>
      </div>
      <!-- Q8: Goal -->
      <div class="dna-step">
        <div class="dna-step-header">
          <div class="dna-step-num">8</div>
          <div><div class="dna-step-title">What is your main goal?</div><div class="dna-step-sub">What does success look like for you in 12 months?</div></div>
        </div>
        <textarea class="form-textarea" id="q-goal" placeholder="e.g. I want to replace my salary of $3,000/month. I want to build something I can be proud of. I want to create jobs for 5 people in my city. I want to raise funding and scale regionally..." style="min-height:90px"></textarea>
      </div>
      <!-- SUBMIT -->
      <div style="text-align:center;padding:1rem 0 2rem">
        <button class="btn btn-primary" style="padding:1rem 2.5rem;font-size:1rem" onclick="submitDNA()">
          🧬 Discover My Business Match →
        </button>
        <div style="font-size:.75rem;color:var(--text3);margin-top:.75rem">Powered by Gemini AI · Takes 15–30 seconds</div>
      </div>
    </div>
  `;
  formData = {};
}

function selectPill(field, value, el) {
  // Deselect others in same group
  el.closest('.pill-grid').querySelectorAll('.pill-opt').forEach(p=>p.classList.remove('selected'));
  el.classList.add('selected');
  formData[field] = value;
}

// ── SUBMIT ────────────────────────────────────────────────────────────────
async function submitDNA() {
  // Validate
  const name    = document.getElementById('q-name')?.value?.trim();
  const city    = document.getElementById('q-city')?.value?.trim();
  const skills  = document.getElementById('q-skills')?.value?.trim();
  const goal    = document.getElementById('q-goal')?.value?.trim();

  if(!formData.country)        { Toast.show('Please select your country','error'); return; }
  if(!formData.industry)       { Toast.show('Please select an industry','error'); return; }
  if(!skills || skills.length < 10) { Toast.show('Please describe your skills (at least a few words)','error'); return; }
  if(!formData.budget)         { Toast.show('Please select your budget','error'); return; }
  if(!formData.timeAvailable)  { Toast.show('Please select your available time','error'); return; }
  if(!formData.experience)     { Toast.show('Please select your experience level','error'); return; }
  if(!goal || goal.length < 10){ Toast.show('Please describe your main goal','error'); return; }

  showGenerating();

  const body = {
    fullName: name || Auth.user().name,
    country:       formData.country,
    city:          city || '',
    industry:      formData.industry,
    skills,
    budget:        formData.budget,
    timeAvailable: formData.timeAvailable,
    experience:    formData.experience,
    goal,
  };

  try {
    const d = await api.post('/business-dna/generate', body);
    if(!d?.success) throw new Error(d?.error || 'Generation failed');
    currentDNA = d.dna;
    showResult(d.dna);
    Toast.show('Your Business DNA is ready!', 'success');
  } catch(err) {
    Toast.show(err.message || 'Something went wrong. Please try again.', 'error');
    showForm();
  }
}

// ── GENERATING STATE ──────────────────────────────────────────────────────
function showGenerating() {
  document.getElementById('dna-view').innerHTML = `
    <div class="generating-overlay">
      <div class="gen-spinner"></div>
      <div style="font-family:'Bebas Neue',cursive;font-size:1.6rem;letter-spacing:1px;color:var(--text);margin-bottom:.4rem">ANALYZING YOUR PROFILE</div>
      <div style="font-size:.85rem;color:var(--text3)">Gemini AI is building your personalized business match...</div>
      <div class="gen-steps">
        <div class="gen-step-row active" id="gs1"><div class="gsr-dot"></div><span>Analyzing your skills and background</span></div>
        <div class="gen-step-row" id="gs2"><div class="gsr-dot"></div><span>Researching your country's market</span></div>
        <div class="gen-step-row" id="gs3"><div class="gsr-dot"></div><span>Matching to best business opportunity</span></div>
        <div class="gen-step-row" id="gs4"><div class="gsr-dot"></div><span>Calculating viability scores</span></div>
        <div class="gen-step-row" id="gs5"><div class="gsr-dot"></div><span>Building your launch roadmap</span></div>
      </div>
    </div>`;
  // Animate steps
  const steps = ['gs1','gs2','gs3','gs4','gs5'];
  let i = 0;
  const iv = setInterval(() => {
    if(i > 0) { const prev=document.getElementById(steps[i-1]); if(prev){prev.classList.remove('active');prev.classList.add('done');prev.querySelector('.gsr-dot').style.background='#22c55e';} }
    if(i < steps.length) { const cur=document.getElementById(steps[i]); if(cur)cur.classList.add('active'); }
    i++;
    if(i >= steps.length) clearInterval(iv);
  }, 3500);
}

// ── RESULT VIEW ───────────────────────────────────────────────────────────
function showResult(dna) {
  document.getElementById('dna-status-label').textContent = `${dna.country} · ${dna.industry}`;
  const r = dna.matchResult;
  if(!r?.businessMatch) { showForm(); return; }

  let parsedFull = {};
  try { parsedFull = JSON.parse(r.fullContent||'{}'); } catch{}

  const score = r.score || 0;
  const sb = r.scoreBreakdown || {};
  const circumference = 2 * Math.PI * 44;
  const dashOffset = circumference - (score / 100) * circumference;
  const scoreColor = score >= 75 ? '#22c55e' : score >= 55 ? '#f59e0b' : '#ef4444';
  const riskClass = (r.riskLevel||'').toLowerCase().includes('low') ? 'risk-low' : (r.riskLevel||'').toLowerCase().includes('high') ? 'risk-high' : 'risk-medium';

  const STAGES = ['idea','validated','branded','marketing','launched','growing'];
  const STAGE_LABELS = ['Idea','Validated','Branded','Marketing','Launched','Growing'];
  const curStageIdx = STAGES.indexOf(dna.journeyStage || 'idea');

  document.getElementById('dna-view').innerHTML = `
    <!-- JOURNEY BAR -->
    <div class="journey-bar">
      <h4>📍 YOUR JOURNEY</h4>
      <div class="journey-stages">
        ${STAGES.map((s,i) => `
          <div class="j-stage ${i < curStageIdx ? 'done' : i === curStageIdx ? 'current' : ''}" style="position:relative">
            ${i < STAGES.length-1 ? '<div class="j-line"></div>' : ''}
            <div class="j-stage-dot">${i < curStageIdx ? '✓' : i+1}</div>
            <div class="j-stage-label">${STAGE_LABELS[i]}</div>
          </div>`).join('')}
      </div>
    </div>

    <!-- SCORE + MATCH -->
    <div class="score-section">
      <div class="score-big">
        <div class="score-circle">
          <svg width="110" height="110" viewBox="0 0 110 110">
            <circle cx="55" cy="55" r="44" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="8"/>
            <circle cx="55" cy="55" r="44" fill="none" stroke="${scoreColor}" stroke-width="8"
              stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}"
              stroke-linecap="round" style="transition:stroke-dashoffset 1.5s ease"/>
          </svg>
          <div class="score-num">${score}</div>
          <div class="score-lbl">Score</div>
        </div>
        <div class="score-right">
          <div class="match-label">YOUR BUSINESS MATCH</div>
          <h3>${r.businessMatch}</h3>
          <p>${r.whyMatch}</p>
          <div style="margin-top:.75rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
            <span class="risk-badge ${riskClass}">Risk: ${r.riskLevel?.split('—')[0]?.trim() || 'Medium'}</span>
            <span style="font-size:.82rem;color:var(--gold);font-weight:600">💰 Est. Month 6: ${r.estimatedRevenue}</span>
          </div>
        </div>
      </div>
      <!-- Score Breakdown -->
      <div class="radar-bars" style="margin-top:1.5rem">
        ${Object.entries({
          'Market Opportunity':  sb.marketOpportunity  || 0,
          'Financial Viability': sb.financialViability || 0,
          'Competition Risk':    sb.competitionRisk    || 0,
          'Execution Ready':     sb.executionReadiness || 0,
          'Marketing Strength':  sb.marketingStrength  || 0,
          'Fundability':         sb.fundability        || 0,
        }).map(([label,val])=>`
          <div class="radar-bar-item">
            <div class="radar-bar-label"><span>${label}</span><span>${val}/100</span></div>
            <div class="radar-bar-track"><div class="radar-bar-fill" style="width:${val}%;background:${val>=70?'#22c55e':val>=50?'var(--gold)':'#ef4444'}"></div></div>
          </div>`).join('')}
      </div>
    </div>

    <!-- INFO GRID -->
    <div class="dna-info-grid">
      <div class="dna-info-card highlight">
        <h4>🌍 MARKET OPPORTUNITY IN ${(dna.country||'').toUpperCase()}</h4>
        <p>${r.marketOpportunity}</p>
      </div>
      <div class="dna-info-card purple">
        <h4>⚡ YOUR UNFAIR ADVANTAGE</h4>
        <p>${parsedFull.unfairAdvantage || 'Your unique background and local market knowledge give you an edge that outside competitors cannot replicate.'}</p>
      </div>
      <div class="dna-info-card green">
        <h4>💼 INVESTORS TO CONTACT</h4>
        <p>${parsedFull.investorsToContact || 'Local angel networks, government startup programs, and regional accelerators are your best first step for funding.'}</p>
      </div>
      <div class="dna-info-card red">
        <h4>⚠ BIGGEST RISK</h4>
        <p>${parsedFull.biggestRisk || 'Moving too slowly. The window of opportunity in your market is open now. Execution speed is your biggest competitive advantage.'}</p>
      </div>
    </div>

    <!-- 5 STARTING STEPS -->
    <div class="score-section" style="margin-bottom:1.25rem">
      <h4 style="font-family:'Bebas Neue',cursive;font-size:1rem;letter-spacing:1px;color:var(--gold);margin-bottom:1rem">🚀 YOUR 5 STARTING STEPS</h4>
      <div class="steps-list">
        ${(r.startingSteps||[]).map((s,i)=>`
          <div class="step-item">
            <div class="step-item-num">${i+1}</div>
            <div class="step-item-text">${s}</div>
          </div>`).join('')}
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="dna-actions">
      <button class="btn btn-primary" onclick="window.location.href='launch-package.html'" style="flex:1;justify-content:center;padding:.85rem">
        ⚡ Generate My Full Launch Package →
      </button>
      <button class="btn btn-secondary" onclick="resetDNA()">↺ Redo DNA</button>
      <button class="btn btn-secondary" onclick="window.location.href='chat.html'">◎ Ask AI Advisor</button>
    </div>
    <div style="font-size:.75rem;color:var(--text3);text-align:center;margin-top:.75rem">
      Your DNA was generated on ${new Date(dna.completedAt||dna.updatedAt).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}
    </div>
  `;
}

async function resetDNA() {
  if(!confirm('Start over? Your current Business DNA will be deleted.')) return;
  await api.del('/business-dna/reset');
  currentDNA = null;
  showForm();
  Toast.show('DNA reset. Let\'s build a better match!', 'info');
}

init();
</script>
</body>
</html>
