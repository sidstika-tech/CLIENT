<link rel="stylesheet" href="../css/main.css">
<style>
.cat-filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.cat-btn{padding:.4rem 1rem;border-radius:20px;font-size:.8rem;font-weight:500;border:1px solid var(--border);color:var(--text3);transition:.15s;cursor:pointer;}
.cat-btn.active{background:var(--gold-dim);border-color:var(--border-gold);color:var(--gold);}
</style>

<body>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">AI TOOLS HUB</span>
      <div class="topbar-right">
        <span style="font-size:.8rem;color:var(--text3)">17 AI-powered tools</span>
      </div>
    </div>
    <div class="page-content">
      <div class="cat-filters">
        <button class="cat-btn active" onclick="filterCat('all',this)">All Tools</button>
        <button class="cat-btn" onclick="filterCat('brand',this)">Brand & Identity</button>
        <button class="cat-btn" onclick="filterCat('plan',this)">Planning & Strategy</button>
        <button class="cat-btn" onclick="filterCat('legal',this)">Legal & Finance</button>
        <button class="cat-btn" onclick="filterCat('mkt',this)">Marketing</button>
        <button class="cat-btn" onclick="filterCat('sales',this)">Sales & Copy</button>
      </div>
      <div class="tools-grid" id="tools-grid"></div>
    </div>
  </div>
</div>

<!-- TOOL MODAL -->
<div class="modal-overlay" id="tool-modal">
  <div class="modal" style="max-width:680px">
    <div class="modal-header">
      <span id="modal-icon" style="font-size:1.5rem"></span>
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div style="font-size:.8rem;color:var(--text3);margin-top:.1rem" id="modal-desc"></div>
      </div>
      <button class="modal-close" onclick="closeModal('tool-modal')" style="position:sticky;top:0;flex-shrink:0">✕</button>
    </div>
    <div class="modal-body">
      <div id="modal-form"></div>
      <div id="modal-result" style="display:none" class="result-panel">
        <h4>Generated Result</h4>
        <div class="result-content" id="modal-result-content"></div>
        <div class="result-actions">
          <button class="btn btn-secondary btn-sm" onclick="copyText(window._lastResult)">Copy Text</button>
          <button class="btn btn-secondary btn-sm" onclick="exportReport(window._lastReportId,'docx')">↓ DOCX</button>
          <button class="btn btn-secondary btn-sm" onclick="exportReport(window._lastReportId,'pdf')">↓ PDF</button>
          <button class="btn btn-secondary btn-sm" onclick="resetModal()">← New</button>
          <button class="btn btn-danger btn-sm" onclick="closeModal('tool-modal')" style="margin-left:auto">✕ Close</button>
        </div>
      </div>
    </div>
    <div class="modal-footer" id="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('tool-modal')">Cancel</button>
      <button class="btn btn-primary" id="generate-btn" onclick="generateTool()"><span class="loader" id="gen-loader" style="display:none"></span> <span id="gen-btn-text">⚡ Generate</span></button>
    </div>
  </div>
</div>

let currentTool = null;

function filterCat(cat, btn) {
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTools(cat);
}

function renderTools(cat='all') {
  const filtered = cat==='all' ? TOOLS : TOOLS.filter(t=>t.cat===cat);
  document.getElementById('tools-grid').innerHTML = filtered.map(t=>`
    <div class="tool-card" onclick="openTool('${t.id}')">
      <div class="tool-icon">${t.icon}</div>
      <div class="tool-name">${t.name}</div>
      <div class="tool-desc">${t.desc}</div>
      <span class="tool-tag ${t.tagClass}">${t.tag}</span>
    </div>
  `).join('');
}

function openTool(toolId) {
  const tool = TOOLS.find(t=>t.id===toolId);
  if(!tool) return;
  currentTool = tool;
  document.getElementById('modal-icon').textContent = tool.icon;
  document.getElementById('modal-title').textContent = tool.name;
  document.getElementById('modal-desc').textContent = tool.desc;
  document.getElementById('modal-result').style.display='none';
  document.getElementById('modal-footer').style.display='flex';
  document.getElementById('modal-form').innerHTML = tool.fields.map(f=>{
    if(f.type==='select') return `<div class="form-group"><label class="form-label">${f.label}</label><select class="form-select" id="f_${f.id}">${f.options.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`;
    if(f.type==='textarea') return `<div class="form-group"><label class="form-label">${f.label}${f.required?'*':''}</label><textarea class="form-textarea" id="f_${f.id}" placeholder="${f.placeholder||''}" ${f.required?'required':''}></textarea></div>`;
    return `<div class="form-group"><label class="form-label">${f.label}${f.required?'*':''}</label><input type="${f.type||'text'}" class="form-input" id="f_${f.id}" placeholder="${f.placeholder||''}" ${f.required?'required':''}></div>`;
  }).join('');
  openModal('tool-modal');
}

async function generateTool() {
  if(!currentTool) return;
  const inputs = {};
  let valid = true;
  currentTool.fields.forEach(f=>{
    const el = document.getElementById(`f_${f.id}`);
    if(el) {
      inputs[f.id] = el.value.trim();
      if(f.required && !inputs[f.id]) { el.style.borderColor='var(--red)'; valid=false; }
      else { el.style.borderColor=''; }
    }
  });
  if(!valid) { Toast.show('Please fill in all required fields','error'); return; }

  const btn = document.getElementById('generate-btn');
  const loader = document.getElementById('gen-loader');
  const btnText = document.getElementById('gen-btn-text');
  btn.disabled=true; loader.style.display='inline-block'; btnText.textContent='Generating...';

  try {
    const data = await api.post('/tools/generate', { toolType: currentTool.id, inputs });
    if(data?.error) throw new Error(data.error);
    if(!data?.report) throw new Error('No result returned');
    window._lastResult = data.report.content;
    window._lastReportId = data.report._id;
    document.getElementById('modal-result-content').innerHTML = renderMarkdown(data.report.content);
    document.getElementById('modal-result').style.display='block';
    document.getElementById('modal-footer').style.display='none';
    Toast.show('Report generated successfully!', 'success');
  } catch(err) {
    Toast.show(err.message||'Generation failed', 'error');
  } finally {
    btn.disabled=false; loader.style.display='none'; btnText.textContent='⚡ Generate';
  }
}

function resetModal() {
  document.getElementById('modal-result').style.display='none';
  document.getElementById('modal-footer').style.display='flex';
}

renderTools();

// Check URL param
const urlTool = new URLSearchParams(window.location.search).get('tool');
if(urlTool) setTimeout(()=>openTool(urlTool),100);
