.cat-btn.active{background:var(--gold-dim);border-color:var(--border-gold);color:var(--gold);}
</style>

<body>
<div class="app-grid-bg"></div><div class="page-particles"></div>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="hamburger">☰</button>
      <span class="topbar-title" id="page-title">AI TOOLS HUB</span>
      <div class="topbar-right">
        <span id="tools-count" style="font-size:.8rem;color:var(--text3)">17 AI-powered tools</span>
      </div>
    </div>
    <div class="page-content">
      <div class="cat-filters">
        <button class="cat-btn active" onclick="filterCat('all',this)" id="cat-all">All Tools</button>
        <button class="cat-btn" onclick="filterCat('brand',this)" id="cat-brand">Brand &amp; Identity</button>
        <button class="cat-btn" onclick="filterCat('plan',this)" id="cat-plan">Planning &amp; Strategy</button>
        <button class="cat-btn" onclick="filterCat('legal',this)" id="cat-legal">Legal &amp; Finance</button>
        <button class="cat-btn" onclick="filterCat('mkt',this)" id="cat-mkt">Marketing</button>
        <button class="cat-btn" onclick="filterCat('sales',this)" id="cat-sales">Sales &amp; Copy</button>
      </div>
      <div class="tools-grid" id="tools-grid"></div>
    </div>
  </div>
</div>

<!-- TOOL MODAL -->
<div class="modal-overlay" id="tool-modal">
  <div class="modal" style="max-width:680px">
    <div class="modal-header">
      <span id="modal-icon" style="font-size:1.5rem"></span>
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div style="font-size:.8rem;color:var(--text3);margin-top:.1rem" id="modal-desc"></div>
      </div>
      <button class="modal-close" onclick="closeModal('tool-modal')" style="flex-shrink:0">✕</button>
    </div>
    <div class="modal-body">
      <div id="modal-form"></div>
      <div id="modal-result" style="display:none" class="result-panel">
        <button class="float-close-btn" onclick="resetModal()" title="Close result">✕</button>
        <h4 id="result-title-lbl">Generated Result</h4>
        <div class="result-content" id="modal-result-content"></div>
        <div class="result-actions">
          <button class="btn btn-secondary btn-sm" id="copy-btn" onclick="copyText(window._lastResult)">Copy Text</button>
          <button class="btn btn-secondary btn-sm" onclick="exportReport(window._lastReportId,'docx')">↓ DOCX</button>
          <button class="btn btn-secondary btn-sm" onclick="exportReport(window._lastReportId,'pdf')">↓ PDF</button>
          <button class="btn btn-secondary btn-sm" id="new-btn" onclick="resetModal()">← New</button>
          <button class="btn btn-danger btn-sm" onclick="closeModal('tool-modal')" id="close-result-btn" style="margin-left:auto">✕ Close</button>
        </div>
      </div>
    </div>
    <div class="modal-footer" id="modal-footer">
      <button class="btn btn-secondary" id="cancel-modal-btn" onclick="closeModal('tool-modal')">Cancel</button>
      <button class="btn btn-primary" id="generate-btn" onclick="generateTool()">
        <span class="loader" id="gen-loader" style="display:none"></span>
        <span id="gen-btn-text">⚡ Generate</span>
      </button>
    </div>
  </div>
</div>

<script src="../js/core.js"></script>

function filterCat(cat,btn) {
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); renderTools(cat);
}

function renderTools(cat='all') {
  const ar = isAr();
  const filtered = cat==='all' ? TOOLS : TOOLS.filter(tl=>tl.cat===cat);
  document.getElementById('tools-grid').innerHTML = filtered.map(tl=>`
    <div class="tool-card" onclick="openTool('${tl.id}')">
      <div class="tool-icon">${tl.icon}</div>
      <div class="tool-name">${ar ? tl.nameAr : tl.name}</div>
      <div class="tool-desc">${ar ? tl.descAr : tl.desc}</div>
      <span class="tool-tag ${tl.tagClass}">${ar ? tl.tagAr : tl.tag}</span>
    </div>`).join('');
}

function openTool(toolId) {
  const tool=TOOLS.find(tl=>tl.id===toolId);
  if(!tool) return;
  currentTool=tool;
  const ar=isAr();
  document.getElementById('modal-icon').textContent=tool.icon;
  document.getElementById('modal-title').textContent=ar?tool.nameAr:tool.name;
  document.getElementById('modal-desc').textContent=ar?tool.descAr:tool.desc;
  document.getElementById('modal-result').style.display='none';
  document.getElementById('modal-footer').style.display='flex';
  document.getElementById('modal-form').innerHTML=tool.fields.map(f=>{
    const lbl = ar&&f.labelAr ? f.labelAr : f.label;
    const required = f.required ? (ar?'*':'*') : '';
    if(f.type==='select') return `<div class="form-group"><label class="form-label">${lbl}</label><select class="form-select" id="f_${f.id}">${f.options.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`;
    if(f.type==='textarea') return `<div class="form-group"><label class="form-label">${lbl}${required}</label><textarea class="form-textarea" id="f_${f.id}" placeholder="${f.placeholder||''}" ${f.required?'required':''}></textarea></div>`;
    return `<div class="form-group"><label class="form-label">${lbl}${required}</label><input type="${f.type||'text'}" class="form-input" id="f_${f.id}" placeholder="${f.placeholder||''}" ${f.required?'required':''}></div>`;
  }).join('');
  openModal('tool-modal');
}

async function generateTool() {
  if(!currentTool) return;
  const ar=isAr();
  const inputs={}; let valid=true;
  currentTool.fields.forEach(f=>{
    const el=document.getElementById(`f_${f.id}`);
    if(el){
      inputs[f.id]=el.value.trim();
      if(f.required&&!inputs[f.id]){el.style.borderColor='var(--red)';valid=false;}
      else el.style.borderColor='';
    }
  });
  if(!valid){Toast.show(t('msg.fill_required'),'error');return;}
  const btn=document.getElementById('generate-btn');
  const loader=document.getElementById('gen-loader');
  const btnText=document.getElementById('gen-btn-text');
  btn.disabled=true; loader.style.display='inline-block'; btnText.textContent=t('btn.generating');
  try {
    const data=await api.post('/tools/generate',{toolType:currentTool.id,inputs});
    if(data?.error) throw new Error(data.error);
    if(!data?.report) throw new Error(ar?'لم يتم إرجاع نتيجة':'No result returned');
    window._lastResult=data.report.content; window._lastReportId=data.report._id;
    document.getElementById('modal-result-content').innerHTML=renderMarkdown(data.report.content);
    document.getElementById('modal-result').style.display='block';
    document.getElementById('modal-footer').style.display='none';
    Toast.show(ar?'تم إنشاء التقرير بنجاح!':'Report generated successfully!','success');
  } catch(err){Toast.show(err.message||(ar?'فشل التوليد':'Generation failed'),'error');}
  finally{btn.disabled=false;loader.style.display='none';btnText.textContent=t('tools.generate');}
}

function resetModal() {
  document.getElementById('modal-result').style.display='none';
  document.getElementById('modal-footer').style.display='flex';
}

renderTools();
const urlTool=new URLSearchParams(window.location.search).get('tool');
if(urlTool) setTimeout(()=>openTool(urlTool),100);
</script>
</body>
</html>
