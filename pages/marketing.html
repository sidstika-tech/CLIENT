<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Marketing Builder — Double Eight AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">

<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18199000373"></script>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-BTB516M1RD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-BTB516M1RD');
</script>
</head>
<body>
<div class="app-grid-bg"></div><div class="page-particles"></div>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="hamburger">☰</button>
      <span class="topbar-title" id="page-title">MARKETING BUILDER</span>
    </div>
    <div class="mobile-tool-tabs">
      <button class="mob-tool-tab active" id="mtab-form" onclick="showMobToolTab('form')">📝 Form</button>
      <button class="mob-tool-tab" id="mtab-result" onclick="showMobToolTab('result')">◈ Result</button>
      <button class="mob-tool-tab" id="mtab-history" onclick="showMobToolTab('history')">🕐 History</button>
    </div>
    <div class="page-content">
      <div class="tool-page-grid">
        <div id="panel-form" class="card">
          <h3 style="font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:1px;margin-bottom:1.25rem;color:var(--gold)" id="form-title">◈ BUILD STRATEGY</h3>
          <div class="form-group"><label class="form-label" id="lbl-name">Business Name *</label><input type="text" class="form-input" id="mk-name" placeholder="Your business name"></div>
          <div class="form-group"><label class="form-label" id="lbl-industry">Industry *</label><input type="text" class="form-input" id="mk-industry" placeholder="e.g. E-commerce, SaaS, Consulting"></div>
          <div class="form-group"><label class="form-label" id="lbl-audience">Target Audience *</label><input type="text" class="form-input" id="mk-audience" placeholder="e.g. SMB owners, 25-40 female consumers"></div>
          <div class="form-group"><label class="form-label" id="lbl-goals">Marketing Goals *</label><textarea class="form-textarea" id="mk-goals" placeholder="e.g. 500 leads/month, 10K Instagram followers" style="min-height:70px"></textarea></div>
          <div class="form-group"><label class="form-label" id="lbl-budget">Monthly Budget</label><input type="text" class="form-input" id="mk-budget" placeholder="e.g. $2,000, $10,000"></div>
          <div class="form-group"><label class="form-label" id="lbl-presence">Current Presence</label><input type="text" class="form-input" id="mk-presence" placeholder="e.g. None, Basic website, 1K IG followers"></div>
          <div class="form-group"><label class="form-label" id="lbl-timeline">Timeline</label>
            <select class="form-select" id="mk-timeline">
              <option>1 month</option><option>3 months</option><option selected>6 months</option><option>12 months</option>
            </select>
          </div>
          <button class="btn btn-primary" style="width:100%" id="gen-btn" onclick="doMarketing()">
            <span class="loader" id="mk-loader" style="display:none"></span>
            <span class="gen-btn-text" id="gen-btn-txt">◈ Build Marketing Strategy</span>
          </button>
        </div>
        <div>
          <div id="panel-result" class="result-panel" style="display:none">
            <button class="float-close-btn" onclick="closeResult()">✕</button>
            <h4 id="result-title">Marketing Strategy</h4>
            <div class="result-content" id="mk-content"></div>
            <div class="result-actions">
              <button class="btn btn-secondary btn-sm" onclick="copyText(window._mkResult)">Copy</button>
              <button class="btn btn-secondary btn-sm" onclick="exportReport(window._mkReportId,'pdf')">↓ PDF</button>
              <button class="btn btn-secondary btn-sm" onclick="exportReport(window._mkReportId,'docx')">↓ DOCX</button>
              <button class="btn btn-secondary btn-sm" onclick="closeResult()">← New</button>
            </div>
          </div>
          <div id="panel-history">
            <div class="section-hdr" style="margin-bottom:1rem"><h3 id="prev-title" style="font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:1px">PREVIOUS STRATEGIES</h3></div>
            <div id="mk-history" class="vault-grid">
              <div class="empty-state"><div class="empty-icon">◈</div><p id="no-prev-txt">No strategies yet</p></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../js/core.js"></script>
<script>
Auth.check(); buildLayout('marketing');
function applyTranslations() {
  document.getElementById('page-title').textContent = t('mkt.title');
  document.getElementById('form-title').textContent = t('mkt.card_title');
  document.getElementById('lbl-name').textContent = t('mkt.name');
  document.getElementById('lbl-industry').textContent = t('mkt.industry');
  document.getElementById('lbl-audience').textContent = t('mkt.audience');
  document.getElementById('lbl-goals').textContent = t('mkt.goals');
  document.getElementById('lbl-budget').textContent = t('mkt.budget');
  document.getElementById('lbl-presence').textContent = t('mkt.presence');
  document.getElementById('lbl-timeline').textContent = t('mkt.timeline');
  document.getElementById('gen-btn-txt').textContent = t('mkt.btn');
  document.getElementById('result-title').textContent = t('mkt.result_title');
  document.getElementById('prev-title').textContent = t('mkt.prev');
  document.getElementById('no-prev-txt').textContent = t('mkt.no_prev');
}
applyTranslations();
function showMobToolTab(tab) {
  document.querySelectorAll('.mob-tool-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('mtab-'+tab).classList.add('active');
  document.getElementById('panel-form').style.display=tab==='form'?'block':'none';
  document.getElementById('panel-result').style.display=tab==='result'?'block':'none';
  document.getElementById('panel-history').style.display=tab==='history'?'block':'none';
}
function closeResult() {
  document.getElementById('panel-result').style.display='none';
  document.getElementById('panel-history').style.display='block';
}
async function doMarketing() {
  const name=document.getElementById('mk-name').value.trim();
  const goals=document.getElementById('mk-goals').value.trim();
  if(!name||!goals){Toast.show(t('msg.fill_required'),'error');return;}
  const btn=document.getElementById('gen-btn'),loader=document.getElementById('mk-loader'),txt=document.getElementById('gen-btn-txt');
  btn.disabled=true;loader.style.display='inline-block';txt.textContent=t('btn.generating');
  try {
    const data=await api.post('/marketing/build',{inputs:{businessName:name,industry:document.getElementById('mk-industry').value,targetAudience:document.getElementById('mk-audience').value,goals,budget:document.getElementById('mk-budget').value,currentPresence:document.getElementById('mk-presence').value,timeline:document.getElementById('mk-timeline').value}});
    if(data?.error) throw new Error(data.error);
    window._mkResult=data.report.content;window._mkReportId=data.report._id;
    document.getElementById('mk-content').innerHTML=renderMarkdown(data.report.content);
    document.getElementById('panel-result').style.display='block';
    document.getElementById('panel-history').style.display='none';
    if(window.innerWidth<900) showMobToolTab('result');
    Toast.show(localStorage.getItem('d8_lang')==='ar'?'تم بناء الاستراتيجية!':'Strategy built!','success');
  } catch(e){Toast.show(e.message,'error');}
  finally{btn.disabled=false;loader.style.display='none';txt.textContent=t('mkt.btn');}
}
async function loadHistory() {
  const d=await api.get('/marketing/reports');
  if(!d?.reports?.length) return;
  document.getElementById('mk-history').innerHTML=d.reports.map(r=>`<div class="vault-item"><div class="vault-item-header"><div class="vault-item-icon">◈</div><div><div class="vault-item-title">${r.title}</div><div class="vault-item-meta">${timeAgo(r.createdAt)}</div></div></div></div>`).join('');
}
loadHistory();
</script>
</body>
</html>
