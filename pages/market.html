<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Market Research — Double Eight AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18199000373"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-18199000373');
</script>
</head>
<body>
<div class="app-grid-bg"></div><div class="page-particles"></div>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="hamburger">☰</button>
      <span class="topbar-title" id="page-title">MARKET RESEARCH</span>
    </div>
    <div class="mobile-tool-tabs">
      <button class="mob-tool-tab active" id="mtab-form" onclick="showMobToolTab('form')">📝 Form</button>
      <button class="mob-tool-tab" id="mtab-result" onclick="showMobToolTab('result')">◉ Result</button>
      <button class="mob-tool-tab" id="mtab-history" onclick="showMobToolTab('history')">🕐 History</button>
    </div>
    <div class="page-content">
      <div class="tool-page-grid">
        <div id="panel-form" class="card">
          <h3 style="font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:1px;margin-bottom:1.25rem;color:var(--gold)" id="form-title">◉ NEW RESEARCH</h3>
          <div class="form-group"><label class="form-label" id="lbl-niche">Industry / Niche *</label><input type="text" class="form-input" id="mr-niche" placeholder="e.g. Electric Vehicles, SaaS CRM"></div>
          <div class="form-group"><label class="form-label" id="lbl-region">Target Region</label><input type="text" class="form-input" id="mr-region" placeholder="e.g. Global, MENA, United States"></div>
          <div class="form-group"><label class="form-label" id="lbl-demo">Target Demographics</label><input type="text" class="form-input" id="mr-demo" placeholder="e.g. 25-45 professionals, SMBs"></div>
          <div class="form-group"><label class="form-label" id="lbl-focus">Research Focus</label>
            <select class="form-select" id="mr-focus">
              <option>Full market analysis</option>
              <option>Competitor landscape</option>
              <option>Customer behavior</option>
              <option>Market entry strategy</option>
              <option>Trend &amp; opportunity analysis</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label" id="lbl-budget">Budget Range</label><input type="text" class="form-input" id="mr-budget" placeholder="e.g. $10,000–$50,000/month"></div>
          <button class="btn btn-primary" style="width:100%" id="gen-btn" onclick="doResearch()">
            <span class="loader" id="mr-loader" style="display:none"></span>
            <span class="gen-btn-text" id="gen-btn-txt">◉ Generate Research Report</span>
          </button>
        </div>
        <div>
          <div id="panel-result" class="result-panel" style="display:none">
            <button class="float-close-btn" onclick="closeResult()">✕</button>
            <h4 id="result-title">Market Research Report</h4>
            <div class="result-content" id="mr-content"></div>
            <div class="result-actions">
              <button class="btn btn-secondary btn-sm" onclick="copyText(window._mrResult)">Copy</button>
              <button class="btn btn-secondary btn-sm" onclick="exportReport(window._mrReportId,'pdf')">↓ PDF</button>
              <button class="btn btn-secondary btn-sm" onclick="exportReport(window._mrReportId,'docx')">↓ DOCX</button>
              <button class="btn btn-secondary btn-sm" onclick="closeResult()">← New</button>
            </div>
          </div>
          <div id="panel-history">
            <div class="section-hdr" style="margin-bottom:1rem"><h3 id="prev-title" style="font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:1px">PREVIOUS RESEARCH</h3></div>
            <div id="mr-history" class="vault-grid">
              <div class="empty-state"><div class="empty-icon">◉</div><p id="no-prev-txt">No research reports yet</p></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../js/core.js"></script>
<script>
Auth.check(); buildLayout('market');
function applyTranslations() {
  document.getElementById('page-title').textContent = t('mr.title');
  document.getElementById('form-title').textContent = t('mr.card_title');
  document.getElementById('lbl-niche').textContent = t('mr.niche');
  document.getElementById('lbl-region').textContent = t('mr.region');
  document.getElementById('lbl-demo').textContent = t('mr.demo');
  document.getElementById('lbl-focus').textContent = t('mr.focus');
  document.getElementById('lbl-budget').textContent = t('mr.budget');
  document.getElementById('gen-btn-txt').textContent = t('mr.btn');
  document.getElementById('result-title').textContent = t('mr.result_title');
  document.getElementById('prev-title').textContent = t('mr.prev');
  document.getElementById('no-prev-txt').textContent = t('mr.no_prev');
}
applyTranslations();
function showMobToolTab(tab) {
  document.querySelectorAll('.mob-tool-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('mtab-'+tab).classList.add('active');
  document.getElementById('panel-form').style.display=tab==='form'?'block':'none';
  document.getElementById('panel-result').style.display=tab==='result'?'block':'none';
  document.getElementById('panel-history').style.display=tab==='history'?'block':'none';
}
function closeResult() {
  document.getElementById('panel-result').style.display='none';
  document.getElementById('panel-history').style.display='block';
}
async function doResearch() {
  const niche=document.getElementById('mr-niche').value.trim();
  if(!niche){Toast.show(t('msg.fill_required'),'error');return;}
  const btn=document.getElementById('gen-btn'),loader=document.getElementById('mr-loader'),txt=document.getElementById('gen-btn-txt');
  btn.disabled=true;loader.style.display='inline-block';txt.textContent=t('btn.generating');
  try {
    const data=await api.post('/market-research/analyze',{inputs:{niche,region:document.getElementById('mr-region').value,demographics:document.getElementById('mr-demo').value,focus:document.getElementById('mr-focus').value,budget:document.getElementById('mr-budget').value}});
    if(data?.error) throw new Error(data.error);
    window._mrResult=data.report.content;window._mrReportId=data.report._id;
    document.getElementById('mr-content').innerHTML=renderMarkdown(data.report.content);
    document.getElementById('panel-result').style.display='block';
    document.getElementById('panel-history').style.display='none';
    if(window.innerWidth<900) showMobToolTab('result');
    Toast.show(localStorage.getItem('d8_lang')==='ar'?'اكتمل البحث!':'Research complete!','success');
  } catch(e){Toast.show(e.message,'error');}
  finally{btn.disabled=false;loader.style.display='none';txt.textContent=t('mr.btn');}
}
async function loadHistory() {
  const d=await api.get('/market-research/reports');
  if(!d?.reports?.length) return;
  document.getElementById('mr-history').innerHTML=d.reports.map(r=>`<div class="vault-item"><div class="vault-item-header"><div class="vault-item-icon">◉</div><div><div class="vault-item-title">${r.title}</div><div class="vault-item-meta">${timeAgo(r.createdAt)}</div></div></div></div>`).join('');
}
loadHistory();
</script>
</body>
</html>
